<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12362f">
  <title>ConnectSphere · Event operations</title><script type="module" src="/src/main.js"></script>
  <style>.skip-link{position:fixed;top:-100px}.skip-link:focus{top:1rem}</style>
</head>
<body>
<div x-data="appState()" class="min-h-screen">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <template x-if="!user">
    <main class="login-shell">
      <section class="login-story" aria-labelledby="welcome-title">
        <div class="brand brand-light"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
        <div class="login-story-copy"><p class="eyebrow eyebrow-light">One connected workspace</p><h1 id="welcome-title">Plan every detail.<br>Keep every team aligned.</h1><p>Move events from request to readiness with a clear, role-specific view of the work that matters to you.</p></div>
        <p class="login-support">ConnectSphere Event Services</p>
      </section>
      <section class="login-panel" aria-labelledby="sign-in-title"><div class="login-card">
        <div class="mobile-brand brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
        <p class="eyebrow">Secure workspace</p><h2 id="sign-in-title">Welcome back</h2><p class="subtle">Sign in with your organisation account to continue.</p>
        <div x-show="alert && alert.message" x-cloak class="alert alert-error login-alert" role="alert"><span class="alert-icon" aria-hidden="true">!</span><span x-text="alert && alert.message"></span></div>
        <form class="login-form" @submit.prevent="login(loginForm.username, loginForm.password)" :aria-busy="loading"><fieldset class="login-fields" :disabled="loading">
          <div class="field-group"><label for="username">Username</label><input id="username" x-model.trim="loginForm.username" required autocomplete="username" placeholder="Enter your username" :aria-invalid="!!fieldErrors.username" aria-describedby="username-error"><small id="username-error" class="field-error" x-text="fieldErrors.username"></small></div>
          <div class="field-group"><label for="password">Password</label><div class="password-field"><input id="password" x-model="loginForm.password" required :type="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="Enter your password" :aria-invalid="!!fieldErrors.password" aria-describedby="password-error"><button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" x-text="showPassword ? 'Hide' : 'Show'"></button></div><small id="password-error" class="field-error" x-text="fieldErrors.password"></small></div>
          <button class="button button-primary button-block" :disabled="loading" :aria-busy="loading"><span x-show="loading" class="spinner" aria-hidden="true"></span><span x-text="loading ? 'Signing in…' : 'Sign in to workspace'"></span></button>
        </fieldset></form><p class="sr-only" role="status" x-text="loading ? 'Signing in' : ''"></p><p class="login-note">Your access is tailored to your assigned role.</p>
      </div></section>
    </main>
  </template>

  <template x-if="user"><div class="app-shell" :class="{ 'nav-open': sidebarOpen, 'sidebar-collapsed': sidebarCollapsed && !compactNav }" @keydown.escape.window="if (sidebarOpen) { sidebarOpen = false; $refs.menuButton?.focus(); }">
    <div class="mobile-scrim" x-show="sidebarOpen" x-transition.opacity @click="sidebarOpen = false" aria-hidden="true"></div>
    <aside id="app-sidebar" class="sidebar" aria-label="Application sidebar">
      <div class="sidebar-brand brand brand-light"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
      <nav class="side-nav" aria-label="Main navigation"><p class="nav-section-label">Menu</p>
        <template x-for="item in navigation" :key="item.path"><button x-show="canAccess(item.role, user.role)" @click="navigate(item.path); sidebarOpen = false" class="nav-item" :class="currentPath === item.path ? 'active' : ''" :title="sidebarCollapsed && !compactNav ? item.label : null" :aria-current="currentPath === item.path ? 'page' : null"><span class="nav-icon" aria-hidden="true" x-html="iconFor(item.icon)"></span><span class="nav-label" x-text="item.label"></span></button></template>
      </nav>
      <div class="sidebar-footer"><div class="role-card"><span class="avatar" aria-hidden="true" x-text="userInitials()"></span><span class="role-card-copy"><strong x-text="user.username"></strong><small x-text="user.role"></small></span></div><button class="signout-button" @click="logout()" :title="sidebarCollapsed && !compactNav ? 'Sign out' : null"><span aria-hidden="true" x-html="iconFor('logout')"></span><span class="signout-label">Sign out</span></button></div>
    </aside>
    <section class="app-area">
      <header class="topbar"><div class="topbar-start"><button type="button" class="sidebar-toggle icon-control" x-ref="menuButton" @click="toggleSidebar()" :aria-expanded="sidebarExpanded()" aria-controls="app-sidebar" :aria-label="sidebarExpanded() ? 'Collapse sidebar' : 'Expand sidebar'" :title="sidebarExpanded() ? 'Collapse sidebar' : 'Expand sidebar'" x-html="iconFor(compactNav ? 'menu' : 'panel-left')"></button><div class="breadcrumb"><span>ConnectSphere</span><b aria-hidden="true">/</b><strong x-text="pageTitle()"></strong></div></div><div class="topbar-actions"><div class="notification-center" @click.outside="notificationOpen = false"><button type="button" class="notification-trigger icon-control" @click="notificationOpen = !notificationOpen" :aria-expanded="notificationOpen" aria-controls="notification-panel" aria-label="Open notifications"><span x-html="iconFor('bell')"></span><b x-show="unreadNotifications()" x-text="unreadNotifications() > 9 ? '9+' : unreadNotifications()"></b></button><section id="notification-panel" class="notification-panel" x-show="notificationOpen" x-cloak x-transition role="region" aria-label="Notifications"><header><div><h2>Notifications</h2><p x-text="unreadNotifications() ? `${unreadNotifications()} unread` : 'You’re all caught up'"></p></div><button type="button" class="icon-button" @click="notificationOpen = false" aria-label="Close notifications">×</button></header><div class="notification-empty" x-show="!notifications.length"><span x-html="iconFor('bell')"></span><strong>No notifications yet</strong><p>Updates about your events and bookings will appear here.</p></div><ul x-show="notifications.length"><template x-for="notification in notifications" :key="notification.id"><li class="notification-item" :class="[notification.read ? 'is-read' : 'is-unread', `tone-${notificationTone(notification)}`]"><div class="notification-main" :class="notificationTarget(notification) ? 'has-target' : ''"><span class="notification-kind-icon" aria-hidden="true" x-html="iconFor(notificationIcon(notification))"></span><span class="notification-copy"><span class="notification-heading"><template x-if="notificationTarget(notification)"><button type="button" class="notification-open" @click="openNotification(notification)" :aria-label="`${notificationTitle(notification)}: ${notificationTarget(notification).label.toLowerCase()}`" x-text="notificationTitle(notification)"></button></template><template x-if="!notificationTarget(notification)"><strong x-text="notificationTitle(notification)"></strong></template><i x-show="!notification.read" role="img" aria-label="Unread"></i></span><span class="notification-message" x-text="formatNotificationMessage(notification)"></span><span class="notification-meta"><time x-text="formatNotificationTime(notification.created_at)"></time><span class="notification-link" x-show="notificationTarget(notification)" aria-hidden="true" x-text="`${notificationTarget(notification)?.label} ›`"></span></span></span></div><button class="mark-read" x-show="!notification.read" @click.stop="markNotificationRead(notification)">Mark as read</button></li></template></ul></section></div><span class="timezone-note" title="All dates and times are Singapore time (UTC+8)">Times in SGT</span></div></header>
      <main id="main-content" class="main-content" tabindex="-1">
        <div x-show="alert && alert.message && alert.kind !== 'success'" x-cloak class="alert content-alert" :class="alert && alert.kind === 'info' ? 'alert-info' : 'alert-error'" :role="alert && alert.kind === 'info' ? 'status' : 'alert'"><span class="alert-icon" aria-hidden="true" x-text="alert && alert.kind === 'info' ? 'i' : '!'"></span><span x-text="alert && alert.message"></span><button type="button" class="icon-button" @click="clearAlert()" aria-label="Dismiss message">×</button></div>
        <div x-show="loading" x-cloak class="loading-bar" role="status"><i></i><span>Updating your workspace…</span></div>

        <template x-if="accessDenied"><section class="state-card"><div class="state-icon danger">!</div><p class="eyebrow">Restricted area</p><h1>Access denied</h1><p>This account does not have permission to view that function. Your <strong x-text="user.role"></strong> workspace only shows functions assigned to you.</p><button class="button button-primary" @click="navigate(defaultPath())">Return to my workspace</button></section></template>
        <template x-if="currentPath === '/venue' && isVenueStaff() && venueWorkspace"><section class="operations-page">
          <div class="page-header"><div><p class="eyebrow">Venue Staff workspace</p><h1>Venue operations</h1><p>Review requests requiring attention and keep the venue catalogue accurate.</p></div><button class="button button-primary" @click="toggleVenueCreate()" :disabled="venueWriteBusy()"><span aria-hidden="true">＋</span> Add venue</button></div>
          <div class="summary-strip operations-summary" aria-label="Venue operations summary"><div><span>Active venues<small>Available to book</small></span><strong x-text="venueWorkspace.venues.length"></strong></div><div><span>Pending requests<small>Awaiting your review</small></span><strong x-text="venueWorkspace.bookings.filter(booking => booking.status === 'Pending').length"></strong></div><div><span>Unread updates<small>New activity</small></span><strong x-text="unreadNotifications()"></strong></div></div>
          <!-- [SCRUM-92 | Elnathan] One form for Add venue and Edit, with all nine venue fields (AC1, AC2). -->
          <form class="create-venue-card" x-show="venueWorkspace.showCreate" x-transition @submit.prevent="saveVenueForm()" novalidate :aria-label="venueWorkspace.editing ? 'Edit venue' : 'Add venue'">
            <div class="section-heading"><div><span class="section-icon" x-html="iconFor('building')"></span><div><h2 x-text="venueWorkspace.editing ? `Edit ${venueWorkspace.editing.name}` : 'Add a venue'"></h2><p x-text="venueWorkspace.editing ? 'Only the fields you change are saved.' : 'Make a new space available for event booking.'"></p></div></div><button type="button" class="icon-button" @click="cancelVenueForm()" :disabled="venueWriteBusy()" aria-label="Close venue form">×</button></div>
            <p class="form-message" x-show="venueWorkspace.formMessage" :class="venueWorkspace.formMessage?.kind" :role="venueWorkspace.formMessage?.kind === 'error' ? 'alert' : 'status'" x-text="venueWorkspace.formMessage?.text"></p>
            <fieldset :disabled="venueWriteBusy()">
              <div class="venue-form-grid">
                <div class="field-group"><label for="venue-name">Venue name</label><input id="venue-name" x-model="venueWorkspace.form.name" required placeholder="e.g. Harbour Ballroom" :aria-invalid="!!fieldErrors.name"><small class="field-error" x-text="fieldErrors.name"></small></div>
                <div class="field-group"><label for="venue-location">Location</label><input id="venue-location" x-model="venueWorkspace.form.location" required placeholder="Building or address" :aria-invalid="!!fieldErrors.location"><small class="field-error" x-text="fieldErrors.location"></small></div>
                <div class="field-group"><label for="venue-capacity">Capacity</label><input id="venue-capacity" x-model="venueWorkspace.form.capacity" type="number" min="1" step="1" required placeholder="Maximum guests" :aria-invalid="!!fieldErrors.capacity"><small class="field-error" x-text="fieldErrors.capacity"></small></div>
                <div class="field-group field-wide"><label for="venue-facilities">Facilities</label><input id="venue-facilities" x-model="venueWorkspace.form.facilities" placeholder="e.g. Projector, Stage, WiFi" aria-describedby="venue-list-help" :aria-invalid="!!fieldErrors.facilities"><small class="field-error" x-text="fieldErrors.facilities"></small></div>
                <div class="field-group"><label for="venue-layouts">Supported layouts</label><input id="venue-layouts" x-model="venueWorkspace.form.supported_layouts" placeholder="e.g. Theatre, Banquet" aria-describedby="venue-list-help" :aria-invalid="!!fieldErrors.supported_layouts"><small class="field-error" x-text="fieldErrors.supported_layouts"></small></div>
                <div class="field-group field-wide"><label for="venue-accessibility">Accessibility</label><input id="venue-accessibility" x-model="venueWorkspace.form.accessibility" placeholder="e.g. Step-free entrance, hearing loop" :aria-invalid="!!fieldErrors.accessibility"><small class="field-error" x-text="fieldErrors.accessibility"></small></div>
                <div class="field-group"><label for="venue-hours">Operating hours</label><input id="venue-hours" x-model="venueWorkspace.form.operating_hours" placeholder="e.g. Mon-Fri 08:00-22:00" :aria-invalid="!!fieldErrors.operating_hours"><small class="field-error" x-text="fieldErrors.operating_hours"></small></div>
                <div class="field-group"><label for="venue-setup">Setup time (minutes)</label><input id="venue-setup" x-model="venueWorkspace.form.setup_time_mins" type="number" min="0" step="1" required :aria-invalid="!!fieldErrors.setup_time_mins"><small class="field-error" x-text="fieldErrors.setup_time_mins"></small></div>
                <div class="field-group"><label for="venue-turnaround">Turnaround time (minutes)</label><input id="venue-turnaround" x-model="venueWorkspace.form.turnaround_time_mins" type="number" min="0" step="1" required :aria-invalid="!!fieldErrors.turnaround_time_mins"><small class="field-error" x-text="fieldErrors.turnaround_time_mins"></small></div>
              </div>
              <p id="venue-list-help" class="form-help">Separate facilities and layouts with commas. Leave an optional field empty to clear it.</p>
              <div class="panel-actions"><button type="button" class="button button-secondary" @click="cancelVenueForm()">Cancel</button><button class="button button-primary" :disabled="venueWorkspace.busy || venueWriteBusy()"><span x-show="venueWorkspace.saving" class="spinner"></span><span x-text="venueWorkspace.saving ? 'Saving…' : venueWorkspace.editing ? 'Save changes' : 'Save venue'"></span></button></div>
            </fieldset>
          </form>
          <!-- [SCRUM-92 | Elnathan] Retire asks here, in the page, never in a browser dialog (AC4, D6). -->
          <template x-if="venueWorkspace.retire"><section class="venue-notice warning" role="region" aria-labelledby="venue-retire-title">
            <h2 id="venue-retire-title" tabindex="-1" x-init="$nextTick(() => $el.focus())" x-text="`Retire ${venueWorkspace.retire.venue.name}?`"></h2>
            <p>Coordinators and Leads will no longer be able to request it. Its bookings won't be cancelled, but they will leave Booking requests.</p>
            <p class="form-message error" role="alert" x-show="venueWorkspace.retire.error" x-text="venueWorkspace.retire.error"></p>
            <div class="panel-actions"><button type="button" class="button button-secondary" @click="cancelRetireVenue()" :disabled="venueWorkspace.retire.busy">Cancel</button><button type="button" class="button button-danger" @click="confirmRetireVenue()" :disabled="venueWriteBusy()"><span x-show="venueWorkspace.retire.busy" class="spinner"></span><span x-text="venueWorkspace.retire.busy ? 'Retiring…' : 'Retire venue'"></span></button></div>
          </section></template>
          <!-- [SCRUM-92 | Elnathan] What a save or a retire changed: newly flagged bookings (AC3, D5) or affected bookings (AC4, D6). -->
          <template x-if="venueWorkspace.outcome"><section class="venue-notice" aria-live="polite">
            <div class="venue-notice-heading"><h2 x-text="`${venueWorkspace.outcome.venueName} ${venueWorkspace.outcome.kind === 'retired' ? 'retired' : 'updated'}`"></h2><button type="button" class="icon-button" @click="dismissVenueOutcome()" aria-label="Dismiss">×</button></div>
            <template x-if="venueWorkspace.outcome.kind === 'updated' && venueWorkspace.outcome.bufferChanged"><div>
              <p x-show="!venueWorkspace.outcome.flagged.length">No bookings were newly flagged by this change.</p>
              <template x-if="venueWorkspace.outcome.flagged.length"><div><p>These bookings now clash once the new setup and turnaround times are included. They are flagged, not changed.</p>
                <ul class="booking-list"><template x-for="row in venueWorkspace.outcome.flagged" :key="row.id"><li><div><strong x-text="row.eventTitle"></strong><small class="venue-notice-detail" x-text="`${row.venueName} · ${formatSchedule(row.start, row.end)}`"></small><small class="venue-notice-detail" x-text="row.reason"></small></div><span class="status-badge badge-attention"><i></i><span>Flagged</span></span></li></template></ul></div></template>
            </div></template>
            <template x-if="venueWorkspace.outcome.kind === 'retired'"><div>
              <p x-show="!venueWorkspace.outcome.affected.length">No upcoming bookings held this venue.</p>
              <template x-if="venueWorkspace.outcome.affected.length"><div><p>These bookings weren't cancelled, but they have left Booking requests.</p>
                <ul class="booking-list"><template x-for="row in venueWorkspace.outcome.affected" :key="row.id"><li><div><strong x-text="row.eventTitle"></strong><small class="venue-notice-detail" x-text="formatSchedule(row.start, row.end)"></small></div><span class="status-badge" :class="bookingStatusClass(row.status)"><i></i><span x-text="row.status"></span></span></li></template></ul></div></template>
            </div></template>
          </section></template>
          <div class="operations-grid">
            <section class="queue-panel booking-queue-panel" aria-labelledby="venue-requests-title"><div class="queue-heading"><div><h2 id="venue-requests-title">Booking requests</h2><p>Review pending requests and scan the complete booking history.</p></div><button class="button button-secondary button-compact" :disabled="venueWorkspace.busy" @click="fetchVenueWorkspace()">Refresh</button></div><div class="booking-filters" role="group" aria-label="Filter booking requests"><template x-for="filter in ['All', 'Pending', 'Confirmed', 'Rejected', 'Expired']" :key="filter"><button type="button" @click="venueWorkspace.bookingFilter = filter" :class="venueWorkspace.bookingFilter === filter ? 'active' : ''" :aria-pressed="venueWorkspace.bookingFilter === filter"><span x-text="filter"></span><b x-text="bookingFilterCount(filter)"></b></button></template></div><div class="inline-state" x-show="venueWorkspace.busy" role="status"><span class="spinner dark"></span> Loading requests…</div><div class="inline-state error" x-show="venueWorkspace.bookingError" role="status">Some requests could not be loaded. Refresh to try again.</div><div class="empty-panel" x-show="venueWorkspace.loaded && !venueWorkspace.busy && !venueWorkspace.bookingError && !venueWorkspace.bookings.length"><span x-html="iconFor('inbox')"></span><strong>No booking requests</strong><p>New requests will appear here for review.</p></div><div class="empty-panel filtered-empty" x-show="venueWorkspace.loaded && !venueWorkspace.busy && venueWorkspace.bookings.length && !filteredVenueBookings().length"><span x-html="iconFor('inbox')"></span><strong x-text="`No ${venueWorkspace.bookingFilter.toLowerCase()} requests`"></strong><p>Choose another filter to view booking activity.</p></div><div class="booking-table" x-show="filteredVenueBookings().length"><div class="booking-table-head" aria-hidden="true"><span>Event and venue</span><span>Date and time</span><span>Status</span><span>Action</span></div><template x-for="booking in filteredVenueBookings()" :key="booking.id"><article class="booking-row" :class="booking.status === 'Pending' ? 'needs-action' : ''"><div class="booking-title"><span class="venue-monogram" aria-hidden="true" x-text="initials(booking.venue_name)"></span><div><strong x-text="booking.event_title"></strong><small><span class="mobile-field-label">Venue · </span><span x-text="booking.venue_name"></span></small></div></div><div class="booking-schedule"><span x-html="iconFor('calendar')"></span><span><span class="mobile-field-label">Date · </span><span x-text="formatSchedule(booking.booking_start, booking.booking_end)"></span><small class="venue-notice-detail" x-show="booking.hold_expires_at" x-text="`Hold ${booking.status === 'Expired' ? 'expired' : 'expires'} ${formatHoldExpiry(booking.hold_expires_at)}`"></small></span></div><div class="booking-status"><span class="mobile-field-label">Status · </span><span class="status-badge" :class="bookingStatusClass(booking.status)"><i></i><span x-text="booking.status"></span></span></div><div class="booking-action"><button class="button" :class="booking.status === 'Pending' ? 'button-primary' : 'button-secondary'" @click="openStaffBooking(booking.id)" x-text="booking.status === 'Pending' ? 'Review request' : 'View details'"></button></div><p class="rejection-callout" x-show="booking.rejection_reason"><strong>Rejection reason</strong><span x-text="booking.rejection_reason"></span></p></article></template></div></section>
            <section class="queue-panel venue-catalogue" aria-labelledby="venue-list-title"><div class="queue-heading"><div><h2 id="venue-list-title">Venue catalogue</h2><p>Spaces currently available to request.</p></div><span class="total-count" x-text="`${venueWorkspace.venues.length} total`"></span></div><div class="inline-state error" x-show="!venueWorkspace.busy && !venueWorkspace.loaded" role="status">Venues could not be loaded.</div><div class="empty-panel" x-show="venueWorkspace.loaded && !venueWorkspace.venues.length"><span x-html="iconFor('building')"></span><strong>No venues yet</strong><p>Add a venue to make it available for booking.</p></div><div class="venue-list-head" x-show="venueWorkspace.venues.length" aria-hidden="true"><span>Venue</span><span>Location</span><span>Capacity</span></div><ul class="venue-list"><template x-for="venue in venueWorkspace.venues" :key="venue.id"><li><span class="venue-identity"><span class="venue-monogram" aria-hidden="true" x-text="initials(venue.name)"></span><strong x-text="venue.name"></strong></span><span class="venue-location"><small>Location</small><span x-text="venue.location"></span></span><span class="capacity"><small>Capacity</small><span><b x-text="venue.capacity"></b> people</span></span>
                <!-- [SCRUM-92 | Elnathan] The rest of the venue record, and Edit and Retire (AC2, AC4, AC5). -->
                <div class="venue-record">
                  <dl class="venue-meta">
                    <div><dt>Facilities</dt><dd><template x-for="(item, index) in venue.facilities || []" :key="index"><span class="venue-tag" x-text="item"></span></template><span x-show="!venue.facilities?.length">None listed</span></dd></div>
                    <div><dt>Layouts</dt><dd><template x-for="(item, index) in venue.supported_layouts || []" :key="index"><span class="venue-tag" x-text="item"></span></template><span x-show="!venue.supported_layouts?.length">None listed</span></dd></div>
                    <div><dt>Accessibility</dt><dd x-text="venue.accessibility || 'Not recorded'"></dd></div>
                    <div><dt>Hours</dt><dd x-text="venue.operating_hours || 'Not recorded'"></dd></div>
                    <div><dt>Buffers</dt><dd x-text="venueBufferSummary(venue)"></dd></div>
                  </dl>
                  <div class="venue-actions"><button type="button" class="button button-secondary button-compact" @click="openVenueEdit(venue)" :disabled="venueWriteBusy()" :aria-label="`Edit ${venue.name}`">Edit</button><button type="button" class="button button-danger-quiet button-compact" @click="askRetireVenue(venue)" :disabled="venueWriteBusy()" :aria-label="`Retire ${venue.name}`">Retire</button></div>
                </div>
              </li></template></ul></section>
          </div>
        </section></template>
        <template x-if="unbuiltRole"><section><div class="page-header"><div><p class="eyebrow" x-text="`${user.role} workspace`"></p><h1 x-text="rolePageHeading()"></h1><p x-text="rolePageDescription()"></p></div></div><div class="state-card role-state"><div class="state-icon" x-html="iconFor(roleIcon())"></div><h2>Your focused workspace is ready</h2><p x-text="roleEmptyMessage()"></p><div class="permission-note"><b>✓</b><span><strong>Role-based access is active.</strong><br>Internal planning tools are kept separate from this workspace.</span></div></div></section></template>

        <!-- Technical Support: the read-only equipment worklist (GET /equipment-requests, SCRUM-39 AC2). -->
        <template x-if="currentPath === '/technical' && user.role === 'Technical Support' && technicalWorklist"><section class="operations-page">
          <div class="page-header"><div><p class="eyebrow">Technical Support workspace</p><h1>Equipment worklist</h1><p>Equipment recorded by Coordinators and Leads, soonest event first.</p></div></div>
          <div class="summary-strip operations-summary" aria-label="Equipment worklist summary"><div><span>Events<small>With equipment recorded</small></span><strong x-text="technicalEventGroups().length"></strong></div><div><span>Equipment lines<small>One per equipment type</small></span><strong x-text="technicalWorklist.items.length"></strong></div></div>
          <section class="queue-panel" aria-labelledby="equipment-worklist-title"><div class="queue-heading"><div><h2 id="equipment-worklist-title">Requirements by event</h2><p>Read only. Coordinators record and change requirements.</p></div><button type="button" class="button button-secondary button-compact" :disabled="technicalWorklist.busy" @click="fetchTechnicalWorklist()">Refresh</button></div>
            <div class="inline-state" x-show="technicalWorklist.busy && !technicalWorklist.loaded" role="status"><span class="spinner dark"></span> Loading the worklist…</div>
            <div class="inline-state error" x-show="technicalWorklist.error" role="alert"><span x-text="technicalWorklist.error"></span> <button type="button" class="button button-secondary button-compact" :disabled="technicalWorklist.busy" @click="fetchTechnicalWorklist()">Retry</button></div>
            <div class="empty-panel" x-show="technicalWorklist.loaded && !technicalWorklist.items.length"><span x-html="iconFor('equipment')"></span><strong>No equipment recorded yet</strong><p>Requirements appear here once a Coordinator records them for an event.</p></div>

        <template x-if="currentPath === '/events' && user.role === 'Organiser'"><section class="organiser-page">

            <template x-for="group in organiserGroups()" :key="group.key"><section class="queue-panel request-group" :class="[`request-group-${group.key}`, group.attention ? 'request-group-attention' : '']" :aria-labelledby="`request-group-${group.key}`">
              <div class="queue-heading"><div><h2 :id="`request-group-${group.key}`"><span x-text="group.label"></span> <span class="group-count" x-text="group.events.length"></span></h2><p x-text="group.description"></p></div></div>
              <ul class="request-list"><template x-for="event in group.events" :key="event.id"><li class="request-row">
                <div class="request-summary">
                  <div class="request-title"><h3 x-text="event.title"></h3><span class="request-id" x-text="`#${event.id}`"></span></div>
                  <dl class="request-meta"><template x-if="group.key === 'other'"><div><dt>Status</dt><dd x-text="event.status"></dd></div></template><div><dt>Proposed</dt><dd x-text="formatDate(event.proposed_start)"></dd></div><div><dt>Guests</dt><dd x-text="event.expected_attendance ?? 'Not set'"></dd></div><div><dt x-text="event.submitted_at ? 'Submitted' : 'Created'"></dt><dd x-text="formatUtc(event.submitted_at || event.created_at)"></dd></div></dl>
                </div>
                <div class="request-actions button-group">
                  <button type="button" class="button button-secondary" @click="openEventDetail(event.id)">View details</button>
                  <template x-if="event.status === 'Returned'"><button type="button" class="button button-secondary" @click="openAmend(event)">Update and resubmit</button></template>

                <template x-if="event.status === 'Returned'"><div class="callout callout-attention request-note"><strong>Coordinator's clarification request</strong><span x-text="event.clarification_note || 'No note was included with this request.'"></span></div></template>

        </section></template>

        <template x-if="currentPath === '/events/new' && user.role === 'Organiser'"><section class="form-page">

            <fieldset :disabled="draftBusy"><legend><span>3</span><div>Requirements<small>Optional. Note anything the venue, support and registration teams should plan for.</small></div></legend><div class="form-section-body requirement-grid"><div class="field-group"><label for="venue-requirements">Venue</label><textarea id="venue-requirements" x-model="draft.venue_requirements" rows="3" placeholder="Room layout, catering, breakout spaces…"></textarea></div><div class="field-group"><label for="accessibility-needs">Accessibility</label><textarea id="accessibility-needs" x-model="draft.accessibility_needs" rows="3" placeholder="Wheelchair access, live captioning, assistive listening…"></textarea></div><div class="field-group"><label for="equipment-requirements">Equipment</label><textarea id="equipment-requirements" x-model="draft.equipment_requirements" rows="3" placeholder="Microphones, projectors, video conferencing…"></textarea></div><div class="field-group"><label for="registration-needs">Registration and check-in</label><textarea id="registration-needs" x-model="draft.registration_needs" rows="3" placeholder="Badges, check-in tables, QR scanners…"></textarea></div></div></fieldset>
            <div class="form-actions"><button type="button" class="button button-secondary" @click="navigate('/events')" :disabled="draftBusy">Cancel</button><span class="form-actions-spacer"></span><button type="button" class="button button-secondary" @click="createEventDraft(draft)" :disabled="draftBusy">Save as draft</button><button class="button button-primary" :disabled="draftBusy" :aria-busy="draftBusy"><span class="spinner" x-show="draftBusy" aria-hidden="true"></span><span x-text="draftBusy ? 'Sending…' : 'Submit for review'"></span></button></div>
          </form>
        </section></template>

        <template x-if="currentPath === '/lead/events' && user.role === 'Event Coordinator Lead'"><section class="operations-page">

          <div class="summary-strip operations-summary"><div><span>Needs assignment</span><strong x-text="leadEvents.filter(event => !event.assigned_coordinator_id).length"></strong></div><div><span>Assigned events</span><strong x-text="leadEvents.filter(event => event.assigned_coordinator_id).length"></strong></div><div><span>Active coordinators</span><strong x-text="coordinators.length"></strong></div></div>
          <div x-show="leadEvents.length === 0 && !loading" class="state-card compact"><div class="state-icon" x-html="iconFor('inbox')"></div><h2>No submitted requests</h2><p>Newly submitted requests will appear here for assignment.</p></div>

            <template x-for="event in leadEvents" :key="event.id"><article class="queue-row lead-event-row" :class="!event.assigned_coordinator_id ? 'waiting-row' : ''"><div class="event-card-top"><div><p class="card-kicker" x-text="`Event request #${event.id} · ${event.organiser}`"></p><h3 x-text="event.title"></h3></div><span class="status-badge" :class="statusClass(event.status)"><i></i><span x-text="event.status"></span></span></div><dl class="inline-meta"><div><dt>Proposed</dt><dd x-text="formatDate(event.proposed_start)"></dd></div><div><dt>Attendance</dt><dd x-text="event.expected_attendance ? `${event.expected_attendance} guests` : 'Not set'"></dd></div><div><dt>Coordinator</dt><dd :class="!event.assigned_coordinator ? 'unassigned-text' : ''" x-text="event.assigned_coordinator || 'Needs assignment'"></dd></div></dl><div class="lead-row-actions"><div class="button-group"><button type="button" class="button button-secondary" @click="openEventDetail(event.id)">Open request</button><button type="button" class="button button-secondary" x-show="canBookEvent(event)" @click="openBookings(event)"><span x-html="iconFor('building')"></span> Venue bookings</button></div><div class="assignment-controls" x-show="canAssignEvent(event)"><div class="select-field"><label :for="`coordinator-${event.id}`">Assigned coordinator</label><select :id="`coordinator-${event.id}`" x-model="event.selectedCoordinatorId"><option value="">Select coordinator</option><template x-for="coordinator in coordinators" :key="coordinator.id"><option :value="coordinator.id" x-text="coordinator.username"></option></template></select></div><button class="button button-primary" @click="saveAssignment(event)" x-text="event.assigned_coordinator_id ? 'Save reassignment' : 'Assign coordinator'"></button></div></div></article></template>
          </div>
        </section></template>

        <template x-if="currentPath === '/coordinator/all-events' && user.role === 'Coordinator'"><section class="coordinator-page">

          <section class="state-card compact" x-show="allEventsView.denied" role="alert"><div class="state-icon danger">!</div><h2>You can't view these events</h2><p x-text="allEventsView.error"></p></section>

          <div class="inline-state" x-show="!allEventsView.loaded && !allEventsView.error" role="status"><span class="spinner dark" aria-hidden="true"></span> Loading events…</div>
          <section x-show="allEventsView.loaded && !allEventsView.denied && !allCoordinatorEvents.length" class="state-card compact"><div class="state-icon" x-html="iconFor('calendar')"></div><h2>No submitted events</h2><p>Organiser drafts stay private and don't appear here.</p></section>
          <template x-if="allEventsView.loaded && !allEventsView.denied && allCoordinatorEvents.length"><div class="request-workspace">

            <div class="filter-chips" role="group" aria-label="Show events by status"><template x-for="chip in allEventStatusChips()" :key="chip.key"><button type="button" @click="allEventsView.status = chip.key" :class="allEventsView.status === chip.key ? 'active' : ''" :aria-pressed="allEventsView.status === chip.key"><span x-text="chip.label"></span><b x-text="chip.count"></b></button></template></div>
            <div class="empty-panel card" x-show="!filteredAllEvents().length"><span x-html="iconFor('inbox')"></span><strong>No events match</strong><p>Try another search or status.</p><button type="button" class="button button-secondary button-compact" @click="Object.assign(allEventsView, { query: '', status: 'all' }); $nextTick(() => document.getElementById('all-events-search')?.focus())">Clear search and filter</button></div>
            <section class="queue-panel request-group" x-show="filteredAllEvents().length" aria-label="Submitted events"><ul class="request-list"><template x-for="event in filteredAllEvents()" :key="event.id"><li class="request-row">
              <div class="request-summary">
                <div class="request-title"><h3 x-text="event.title"></h3><span class="request-id" x-text="`#${event.id}`"></span><span class="status-badge" :class="statusClass(event.status)"><i></i><span x-text="event.status"></span></span></div>
                <dl class="request-meta"><div><dt>Organiser</dt><dd x-text="event.organiser"></dd></div><div><dt>Proposed</dt><dd x-text="formatDate(event.proposed_start)"></dd></div><div><dt>Coordinator</dt><dd x-text="event.is_assigned_to_me ? 'You' : (event.assigned_coordinator || 'Unassigned')"></dd></div></dl>

            </li></template></ul></section>
          </div></template>
        </section></template>

        <template x-if="currentPath === '/coordinator/events' && user.role === 'Coordinator'"><section class="coordinator-page">

          <div class="inline-state" x-show="!assignedView.loaded && !assignedView.error" role="status"><span class="spinner dark" aria-hidden="true"></span> Loading your requests…</div>
          <section x-show="assignedView.loaded && !assignedView.denied && !assignedEvents.length" class="state-card compact"><div class="state-icon" x-html="iconFor('inbox')"></div><h2>No requests assigned to you</h2><p>Requests the Event Coordinator Lead assigns to you will appear here.</p></section>

          </div></template>
        </section></template>

    <div class="toast-region" role="status" aria-live="polite"><template x-if="alert && alert.message && alert.kind === 'success'"><div class="toast"><span class="alert-icon" aria-hidden="true">✓</span><span x-text="alert.message"></span><button type="button" class="icon-button" @click="clearAlert()" aria-label="Dismiss message">×</button></div></template></div>
    <template x-if="eventDetail"><div class="modal-backdrop" @click.self="requestCloseEventDetail()" @keydown.escape.window="if (!modal.open) requestCloseEventDetail()"><section class="modal-card booking-dialog" role="dialog" aria-modal="true" aria-labelledby="event-detail-title" x-init="$nextTick(() => $el.querySelector('button').focus())">

      <div class="modal-body"><div class="inline-state" x-show="eventDetail.loading" role="status">Loading request details...</div><div x-show="eventDetail.error" role="alert"><p x-text="eventDetail.error"></p><button class="button button-secondary" @click="openEventDetail(eventDetail.id)">Retry</button></div>
      <template x-if="eventDetail.detail"><div><span class="status-badge" :class="statusClass(eventDetail.detail.status)" x-text="eventDetail.detail.status"></span><dl class="booking-detail-grid event-detail-fields"><template x-for="[key, value] in eventDetailEntries(eventDetail.detail)" :key="key"><div class="wide"><dt x-text="eventFieldLabel(key)"></dt><dd x-text="eventFieldValue(key, value)"></dd></div></template></dl>
      <p class="field-error" role="alert" x-show="eventDetail.actionError" x-text="eventDetail.actionError"></p><div class="queue-actions" x-show="canDecideEvent(eventDetail.detail)"><button class="button button-primary" x-show="canDecideEvent(eventDetail.detail, 'review')" :disabled="decisionBusy" @click="startReview(eventDetail.id)">Start review</button><button class="button button-success" :disabled="decisionBusy" @click="handleApprove(eventDetail.id)">Approve</button><button class="button button-secondary" :disabled="decisionBusy" @click="openDecision(eventDetail.detail, 'return')">Request clarification</button><button class="button button-danger-quiet" :disabled="decisionBusy" @click="openDecision(eventDetail.detail, 'reject')">Reject</button></div><p x-show="decisionBusy" role="status">Submitting decision...</p>
      <!-- [SCRUM-94] update routine information during planning -->
      <p class="form-help" role="status" x-show="eventDetail.notice" x-text="eventDetail.notice"></p><div class="queue-actions"><button type="button" class="button button-secondary" x-show="canEditRoutine(eventDetail.detail) && !eventDetail.routine" @click="openRoutineEdit()">Edit details</button></div>
      <template x-if="eventDetail.routine"><form id="routine-edit-form" class="routine-edit-form" @submit.prevent="saveRoutineEdit()" novalidate><fieldset :disabled="eventDetail.routine.busy"><div class="decision-heading"><h4>Edit details</h4><p>Routine details can be corrected directly during planning.</p></div><div class="dialog-error" role="alert" x-show="eventDetail.routine.error" x-effect="eventDetail.routine?.error && $nextTick(() => $el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }))"><span x-text="eventDetail.routine.error"></span></div><div class="dialog-error" role="alert" x-show="eventDetail.routine.confirmDiscard" x-effect="eventDetail.routine?.confirmDiscard && $nextTick(() => $el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }))"><span>Discard your unsaved changes?</span><div class="panel-actions"><button type="button" class="button button-secondary" @click="keepRoutineEdit()">Keep editing</button><button type="button" class="button button-danger" @click="closeEventDetail()">Discard changes</button></div></div><p class="form-help" role="status" x-show="eventDetail.routine.message" x-text="eventDetail.routine.message"></p><div class="field-group"><label for="routine-title">Title <em>Required</em></label><input id="routine-title" x-model="eventDetail.routine.form.title" maxlength="255" required></div><div class="field-group"><label for="routine-purpose">Purpose</label><textarea id="routine-purpose" x-model="eventDetail.routine.form.purpose" rows="2"></textarea></div><div class="field-group"><label for="routine-description">Description</label><textarea id="routine-description" x-model="eventDetail.routine.form.description" rows="3"></textarea></div><div class="field-group"><label for="routine-accessibility">Accessibility needs</label><textarea id="routine-accessibility" x-model="eventDetail.routine.form.accessibility_needs" rows="2"></textarea></div><div class="field-group"><label for="routine-registration">Registration needs</label><textarea id="routine-registration" x-model="eventDetail.routine.form.registration_needs" rows="2"></textarea></div><div class="routine-locked"><strong>Needs a change request</strong><p>Date, attendance, venue and equipment requirements are significant changes, so they can't be edited here. Raise a change request instead.</p><dl class="booking-detail-grid"><div><dt>Proposed date and time</dt><dd x-text="eventFieldValue('proposed_start', eventDetail.detail.proposed_start)"></dd></div><div><dt>Expected attendance</dt><dd x-text="eventFieldValue('expected_attendance', eventDetail.detail.expected_attendance)"></dd></div><div class="wide"><dt>Venue requirements</dt><dd x-text="eventFieldValue('venue_requirements', eventDetail.detail.venue_requirements)"></dd></div><div class="wide"><dt>Equipment requirements</dt><dd x-text="eventFieldValue('equipment_requirements', eventDetail.detail.equipment_requirements)"></dd></div></dl></div><div class="modal-actions"><button type="button" class="button button-secondary" @click="cancelRoutineEdit()">Cancel</button><button type="submit" class="button button-primary">Save changes</button></div></fieldset></form></template></div></template></div>
    </section></div></template>

    <template x-if="staffBooking && isVenueStaff()"><div class="modal-backdrop" @click.self="staffBooking = null" @keydown.escape.window="staffBooking = null"><section class="modal-card booking-dialog review-dialog" role="dialog" aria-modal="true" aria-labelledby="staff-booking-title" x-init="$nextTick(() => $el.querySelector('button').focus())"><div class="modal-header"><div><p class="eyebrow">Venue booking</p><h2 id="staff-booking-title" x-text="staffBooking.detail && staffBooking.detail.status !== 'Pending' ? 'Booking details' : 'Review request'">Review request</h2></div><button class="icon-button" @click="staffBooking = null" aria-label="Close booking review">×</button></div><div class="modal-body"><div class="inline-state" x-show="staffBooking.busy" role="status"><span class="spinner dark"></span> Loading booking details…</div><div class="inline-state error" x-show="!staffBooking.busy && !staffBooking.detail">Booking details could not be loaded. Close this dialog and try again.</div>
      <template x-if="staffBooking.detail"><div class="review-content"><div class="dialog-error" role="alert" x-show="staffBooking.error" x-effect="staffBooking?.error && $nextTick(() => $el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }))"><span x-html="iconFor('alert')"></span><span x-text="staffBooking.error"></span></div><div class="review-title"><span class="venue-monogram" aria-hidden="true" x-text="initials(staffBooking.detail.venue?.name)"></span><div><p>Venue</p><h3 x-text="staffBooking.detail.venue?.name"></h3></div><span class="status-badge" :class="bookingStatusClass(staffBooking.detail.status)"><i></i><span x-text="staffBooking.detail.status"></span></span></div><dl class="booking-detail-grid"><div><dt>Event</dt><dd x-text="staffBooking.detail.event_title"></dd></div><div><dt>Requester</dt><dd x-text="requesterLabel(staffBooking.detail)"></dd></div><div class="wide"><dt>Schedule</dt><dd x-text="formatSchedule(staffBooking.detail.booking_start, staffBooking.detail.booking_end)"></dd></div><div><dt>Capacity</dt><dd x-text="staffBooking.detail.venue?.capacity ? `${staffBooking.detail.venue?.capacity} people` : 'Not recorded'"></dd></div><div><dt>Layouts</dt><dd x-text="listText(staffBooking.detail.venue?.supported_layouts)"></dd></div><div class="wide"><dt>Accessibility</dt><dd x-text="staffBooking.detail.venue?.accessibility || 'Not recorded'"></dd></div><div class="wide"><dt>Facilities</dt><dd x-text="listText(staffBooking.detail.venue?.facilities)"></dd></div><div><dt>Hold expires</dt><dd x-text="staffBooking.detail.hold_expires_at ? `${formatUtc(staffBooking.detail.hold_expires_at)}` : 'No hold'"></dd></div><div><dt>Coordinator warning</dt><dd x-text="staffBooking.detail.warning_minutes != null ? `${staffBooking.detail.warning_minutes} min before expiry` : 'Not set'"></dd></div></dl><div class="conflict-callout" role="note" x-show="staffBooking.detail.conflict_flag"><strong>Possible clash</strong><span x-text="staffBooking.detail.conflict_flag?.reason"></span></div><div class="rejection-callout" x-show="staffBooking.detail.rejection_reason"><strong>Rejection reason</strong><span x-text="staffBooking.detail.rejection_reason"></span></div>
      <template x-if="staffBooking.detail.status === 'Pending'"><form class="hold-form" @submit.prevent="setStaffHold()" novalidate><div class="field-group"><label for="staff-hold-expiry">Set or extend the hold <em>Before the booking starts</em></label><input id="staff-hold-expiry" type="datetime-local" x-model="staffBooking.holdExpiry" :disabled="staffBooking.busy" :aria-invalid="!!fieldErrors.holdExpiry"><small class="field-error" x-text="fieldErrors.holdExpiry"></small></div><button type="submit" class="button button-secondary" :disabled="staffBooking.busy">Update hold</button></form></template>
      <template x-if="staffBooking.detail.status === 'Pending'"><form class="decision-form" @submit.prevent="decideStaffBooking('reject')" novalidate><fieldset :disabled="staffBooking.busy"><div class="decision-heading"><h4>Record a decision</h4><p>Approve the requested schedule, or provide a clear reason for rejection.</p></div><div class="field-group"><label for="staff-rejection-reason">Rejection reason <em>Required only when rejecting</em></label><textarea id="staff-rejection-reason" x-model="staffBooking.reason" rows="4" :aria-invalid="!!fieldErrors.reason" placeholder="Explain why this venue or schedule cannot be approved."></textarea><small class="field-error" x-text="fieldErrors.reason"></small></div><div class="modal-actions"><button type="submit" class="button button-danger-quiet">Reject request</button><button type="button" class="button button-success" @click="decideStaffBooking('approve')"><span x-html="iconFor('check')"></span> Approve booking</button></div></fieldset></form></template></div></template>
    </div></section></div></template>
    <template x-if="bookingDialog"><div class="modal-backdrop" @keydown.escape.window="closeBookings()" @click.self="closeBookings()"><section class="modal-card booking-dialog" role="dialog" aria-modal="true" aria-labelledby="booking-title" x-init="$nextTick(() => $el.querySelector('button').focus())">
      <div class="modal-header"><div><p class="eyebrow" x-text="bookingDialog.event.title"></p><h2 id="booking-title">Venue bookings</h2></div><button class="icon-button" @click="closeBookings()" aria-label="Close venue bookings">×</button></div>
      <div class="modal-body">
        <div class="dialog-error" role="alert" x-show="bookingDialog.error" x-effect="bookingDialog?.error && $nextTick(() => $el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }))">
          <span x-html="iconFor('alert')"></span>
          <span x-text="bookingDialog.error"></span>
        </div>
        <p x-show="alert?.message" role="status" x-text="alert?.message"></p>
        <div class="inline-state" x-show="bookingDialog.busy" role="status"><span class="spinner dark"></span> Loading bookings…</div>
        <div class="dialog-section-heading"><div><h3>Booking history</h3><p>Existing requests for this event.</p></div><button type="button" class="button button-secondary button-compact" :disabled="bookingDialog.busy" @click="openBookings(bookingDialog.event)">Refresh</button></div>
        <p x-show="!bookingDialog.busy && !bookingDialog.bookingsLoaded" role="status">Booking history could not be loaded. You can still request a venue if venues are available.</p>
        <p x-show="bookingDialog.bookingsLoaded && !bookingDialog.bookings.length">No booking requests yet.</p>
        <ul class="booking-list"><template x-for="booking in bookingDialog.bookings" :key="booking.id"><li><div><strong x-text="booking.venue_name"></strong><p x-text="formatSchedule(booking.booking_start, booking.booking_end)"></p></div><span class="status-badge" :class="bookingStatusClass(booking.status)"><i></i><span x-text="booking.status"></span></span><div x-show="booking.status === 'Pending' || booking.status === 'Expired'"><p>Hold expiry: <span x-text="formatHoldExpiry(booking.hold_expires_at)"></span></p><p>Warning: <span x-text="booking.warning_minutes == null ? 'Not set' : `${booking.warning_minutes} minutes before expiry`"></span></p></div><template x-if="canUpdateHoldWarning(booking)"><form @submit.prevent="updateHoldWarning(booking)" novalidate><fieldset :disabled="bookingDialog.warningBusy !== null"><div class="field-group"><label :for="`hold-warning-${booking.id}`">Warning lead time (minutes)</label><input :id="`hold-warning-${booking.id}`" type="number" min="0" step="1" required x-model="bookingDialog.warningInputs[booking.id]" :aria-invalid="!!bookingDialog.warningErrors[booking.id]"><small class="field-error" x-text="bookingDialog.warningErrors[booking.id]"></small></div><button class="button button-secondary button-compact" type="submit" :disabled="bookingDialog.warningBusy !== null" x-text="bookingDialog.warningBusy === booking.id ? 'Saving...' : 'Save warning'"></button></fieldset></form></template><p class="rejection-callout" x-show="booking.rejection_reason"><strong>Rejection reason</strong><span x-text="booking.rejection_reason"></span></p></li></template></ul>

        <div class="dialog-section-heading" style="margin-top: 1.5rem;"><div><h3>Find and assess venues</h3><p>Search available venues or evaluate suitability against event requirements.</p></div></div>
        <div class="dialog-error" role="alert" x-show="bookingDialog.searchError"><span x-html="iconFor('alert')"></span><span x-text="bookingDialog.searchError"></span></div>
        <div class="dialog-error" role="alert" x-show="bookingDialog.suitabilityError"><span x-html="iconFor('alert')"></span><span x-text="bookingDialog.suitabilityError"></span></div>

        <form class="venue-search-form venue-search-box" @submit.prevent="searchVenues()">
          <div class="date-time-grid">
            <div class="field-group"><label for="search-start">Search start</label><input id="search-start" type="datetime-local" x-model="bookingDialog.search.start_time"></div>
            <div class="field-group"><label for="search-end">Search end</label><input id="search-end" type="datetime-local" x-model="bookingDialog.search.end_time"></div>
          </div>
          <div class="date-time-grid">
            <div class="field-group"><label for="search-capacity">Min capacity</label><input id="search-capacity" type="number" min="1" placeholder="e.g. 100" x-model.number="bookingDialog.search.min_capacity"></div>
            <div class="field-group"><label for="search-location">Location</label><input id="search-location" type="text" placeholder="e.g. Building 2" x-model.trim="bookingDialog.search.location"></div>
          </div>
          <div class="date-time-grid">
            <div class="field-group"><label for="search-layout">Layout</label><input id="search-layout" type="text" placeholder="e.g. Theatre" x-model.trim="bookingDialog.search.layout"></div>
            <div class="field-group"><label for="search-accessibility">Accessibility</label><input id="search-accessibility" type="text" placeholder="e.g. Wheelchair" x-model.trim="bookingDialog.search.accessibility"></div>
          </div>
          <div class="field-group"><label for="search-facilities">Required facilities (comma-separated)</label><input id="search-facilities" type="text" placeholder="e.g. Projector, Audio" x-model.trim="bookingDialog.search.facilities"><small class="form-help">Enter required facilities (comma-separated, e.g. Projector, Audio). Omitted facilities evaluate as unknown.</small></div>
          <div class="venue-search-footer">
            <label class="venue-search-check"><input type="checkbox" x-model="bookingDialog.search.available_only"> Available only</label>
            <div class="venue-search-btns">
              <button type="button" class="button button-secondary button-compact" :disabled="bookingDialog.checkingSuitability" @click="checkSuitability(bookingDialog.search.facilities)">Check suitability</button>
              <button type="submit" class="button button-primary button-compact" :disabled="bookingDialog.searching">Search venues</button>
            </div>
          </div>
        </form>
        <p x-show="bookingDialog.searchMessage" class="form-help" style="font-style: italic;" x-text="bookingDialog.searchMessage"></p>

        <template x-if="bookingDialog.searchResults && bookingDialog.searchResults.length">
          <div>
            <h4 class="venue-search-heading">Search results (<span x-text="bookingDialog.searchResults.length"></span>)</h4>
            <ul class="booking-list">
              <template x-for="venue in bookingDialog.searchResults" :key="venue.id">
                <li>
                  <div>
                    <strong x-text="venue.name"></strong>
                    <p x-text="`Capacity: ${venue.capacity} · ${venue.location || 'Location not set'}`"></p>
                    <div class="conflict-callout search-conflict-callout" x-show="venue.conflict_reason">
                      <strong>Conflict</strong>
                      <span x-text="venue.conflict_reason"></span>
                    </div>
                  </div>
                  <div class="search-result-side">
                    <span class="status-badge" :class="availabilityClass(venue.is_available)"><i></i><span x-text="venue.is_available ? 'Available' : 'Unavailable'"></span></span>
                    <button type="button" class="button button-secondary button-compact" @click="selectVenueFromSearch(venue)">Request</button>
                  </div>
                </li>
              </template>
            </ul>
          </div>
        </template>

        <template x-if="bookingDialog.suitabilityResults && bookingDialog.suitabilityResults.length">
          <div>
            <h4 class="venue-search-heading">Suitability results</h4>
            <ul class="booking-list">
              <template x-for="item in bookingDialog.suitabilityResults" :key="item.id || item.venue_id">
                <li>
                  <div>
                    <strong x-text="item.name || item.venue_name"></strong>
                    <ul class="suitability-check-list">
                      <template x-for="chk in item.checks" :key="chk.check">
                        <li x-text="`${chk.check}: ${chk.result || chk.status} (${chk.detail})`"></li>
                      </template>
                    </ul>
                  </div>
                  <span class="status-badge" :class="suitabilityBadgeClass(item.suitability)"><i></i><span x-text="suitabilityLabel(item.suitability)"></span></span>
                </li>
              </template>
            </ul>
          </div>
        </template>

        <form class="request-booking-form" @submit.prevent="submitBooking()" novalidate>
          <fieldset :disabled="bookingDialog.submitting"><legend>Request another venue</legend><p class="form-help">Choose an available venue and the complete booking window.</p>
            <p x-show="bookingDialog.ready && !bookingDialog.venues.length" role="status">No venues available. Please contact Venue Staff to add a venue.</p>
            <p x-show="!bookingDialog.busy && !bookingDialog.ready" role="status">Venues could not be loaded. Refresh bookings to try again.</p>
            <div class="field-group"><label for="booking-venue">Venue</label><select id="booking-venue" x-model="bookingDialog.form.venue_id" required :aria-invalid="!!fieldErrors.venue_id"><option value="">Select a venue</option><template x-for="venue in bookingDialog.venues" :key="venue.id"><option :value="venue.id" x-text="venue.name"></option></template></select><small class="field-error" x-text="fieldErrors.venue_id"></small></div>
            <div class="date-time-grid"><div class="field-group"><label for="booking-start">Start date and time</label><input id="booking-start" type="datetime-local" x-model="bookingDialog.form.booking_start" required :aria-invalid="!!fieldErrors.booking_start"><small class="field-error" x-text="fieldErrors.booking_start"></small></div><div class="field-group"><label for="booking-end">End date and time</label><input id="booking-end" type="datetime-local" x-model="bookingDialog.form.booking_end" required :aria-invalid="!!fieldErrors.booking_end"><small class="field-error" x-text="fieldErrors.booking_end"></small></div></div>
            <button class="button button-primary" type="submit" :disabled="bookingDialog.busy || !bookingDialog.ready || !bookingDialog.form.venue_id">Submit booking request</button>
          </fieldset>
        </form>
      </div>
    </section></div></template>
    <template x-if="modal.open"><div class="modal-backdrop" @keydown.escape.window="closeModal()" @click.self="closeModal()"><section class="modal-card" :class="modal.kind === 'amend' ? 'amend-dialog' : ''" role="dialog" aria-modal="true" aria-labelledby="modal-title" x-transition><div class="modal-header"><div><p class="eyebrow" x-text="modal.event ? `Event request #${modal.event.id} · ${modal.event.title}` : 'Event request'"></p><h2 id="modal-title" x-text="modal.kind === 'reject' ? 'Reject request' : modal.kind === 'return' ? 'Request clarification' : modal.resubmit ? 'Update and resubmit' : 'Amend request'"></h2></div><button type="button" class="icon-button" @click="closeModal()" aria-label="Close dialog">×</button></div><form @submit.prevent="submitModal()"><fieldset :disabled="decisionBusy" style="border:0;padding:0;margin:0;min-width:0">
      <template x-if="modal.kind === 'amend'"><div class="modal-body"><div x-show="alert && alert.message" x-cloak class="alert" :class="alert && alert.kind === 'info' ? 'alert-info' : 'alert-error'" role="alert"><span x-text="alert && alert.message"></span></div><template x-if="modal.event?.status === 'Returned'"><div class="callout callout-attention"><strong>Coordinator's clarification request</strong><span x-text="modal.event.clarification_note || 'No note was included with this request.'"></span></div></template><p class="form-help" x-text="modal.resubmit ? 'Answer the request by updating the details below. Saving sends the request back for review.' : 'Only the fields you change are saved. The request stays with its Coordinator.'"></p><div class="inline-state" x-show="modal.loading" role="status"><span class="spinner dark"></span> Loading request details…</div><div class="dialog-error" role="alert" x-show="modal.loadError"><span x-text="modal.loadError"></span></div><fieldset :disabled="!!modal.loading || !!modal.loadError" style="border:0;padding:0;margin:0;min-width:0"><div class="field-group"><label for="amend-title">Event title <em>Required</em></label><input id="amend-title" x-model.trim="amendForm.title" required :aria-invalid="fieldErrors.title ? 'true' : 'false'" aria-describedby="amend-title-error"><small id="amend-title-error" class="field-error" x-text="fieldErrors.title"></small></div><div class="field-group"><label for="amend-purpose">Purpose</label><textarea id="amend-purpose" x-model="amendForm.purpose" rows="2" placeholder="What should this event achieve?"></textarea></div><div class="field-group"><label for="amend-description">Description</label><textarea id="amend-description" x-model="amendForm.description" rows="3" placeholder="Share the format, audience, and any useful context."></textarea></div><div class="date-time-grid"><div class="field-group"><label for="amend-start">Proposed start</label><input id="amend-start" x-model="amendForm.proposed_start" type="datetime-local" :aria-invalid="fieldErrors.proposed_start ? 'true' : 'false'" aria-describedby="amend-start-help amend-start-error"><small id="amend-start-help" class="form-help">Singapore time (SGT).</small><small id="amend-start-error" class="field-error" x-text="fieldErrors.proposed_start"></small></div><div class="field-group"><label for="amend-attendance">Expected attendance</label><input id="amend-attendance" x-model.number="amendForm.expected_attendance" type="number" min="1" inputmode="numeric" placeholder="e.g. 120" :aria-invalid="fieldErrors.expected_attendance ? 'true' : 'false'" aria-describedby="amend-attendance-error"><small id="amend-attendance-error" class="field-error" x-text="fieldErrors.expected_attendance"></small></div></div><div class="field-group"><label for="amend-venue-requirements">Venue</label><textarea id="amend-venue-requirements" x-model="amendForm.venue_requirements" rows="2" placeholder="Room layout, accessibility, catering, breakout spaces…"></textarea></div><div class="field-group"><label for="amend-accessibility-needs">Accessibility</label><textarea id="amend-accessibility-needs" x-model="amendForm.accessibility_needs" rows="2" placeholder="Wheelchair access, live captioning, assistive listening…"></textarea></div><div class="field-group"><label for="amend-equipment-requirements">Equipment</label><textarea id="amend-equipment-requirements" x-model="amendForm.equipment_requirements" rows="2" placeholder="Microphones, projectors, screens, video conferencing…"></textarea></div><div class="field-group"><label for="amend-registration-needs">Registration and check-in</label><textarea id="amend-registration-needs" x-model="amendForm.registration_needs" rows="2" placeholder="Pre-printed badges, on-site check-in tables, QR scanners…"></textarea></div></fieldset></div></template>
      <template x-if="modal.kind !== 'amend'"><div class="modal-body"><p class="form-help" x-text="modal.kind === 'reject' ? 'Explain the decision clearly so the organiser understands the outcome.' : 'Describe exactly what information the organiser needs to provide.'"></p><div class="field-group"><label for="decision-reason">Reason <em>Required</em></label><textarea id="decision-reason" x-model.trim="decisionForm.reason" rows="5" required :aria-invalid="fieldErrors.reason ? 'true' : 'false'" placeholder="Provide a concise, actionable explanation."></textarea><small class="field-error" x-text="fieldErrors.reason"></small><p class="field-error" role="alert" x-text="fieldErrors.form"></p></div></div></template>
      <div class="modal-actions"><span class="change-count" role="status" x-show="modal.kind === 'amend' && !modal.loading && !modal.loadError" x-text="amendChangeCount() === 0 ? 'No changes yet' : amendChangeCount() === 1 ? '1 field changed' : `${amendChangeCount()} fields changed`"></span><button type="button" @click="closeModal()" class="button button-secondary">Cancel</button><template x-if="modal.kind === 'amend' && modal.resubmit && amendChangeCount()"><button type="button" class="button button-secondary" :disabled="!!modal.loading || !!modal.loadError" @click="amendEvent(modal.event.id, amendForm)">Save without resubmitting</button></template><button class="button" :class="modal.kind === 'reject' ? 'button-danger' : 'button-primary'" :disabled="modal.kind === 'amend' && (!!modal.loading || !!modal.loadError || (!modal.resubmit && !amendChangeCount()))" :aria-busy="decisionBusy"><span class="spinner" x-show="decisionBusy" aria-hidden="true"></span><span x-text="modal.kind === 'amend' ? (modal.resubmit ? (amendChangeCount() ? 'Save and resubmit' : 'Resubmit as it is') : 'Save changes') : modal.kind === 'reject' ? 'Reject request' : 'Send clarification request'"></span></button></div>
    </fieldset></form></section></div></template>
  </div></template>
</div>
</body></html>
