<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12362f">
  <title>ConnectSphere · Event operations</title><script type="module" src="/src/main.js"></script>
  <style>.skip-link{position:fixed;top:-100px}.skip-link:focus{top:1rem}</style>
</head>
<body>
<div x-data="appState()" class="min-h-screen">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <template x-if="!user">
    <main class="login-shell">
      <section class="login-story" aria-labelledby="welcome-title">
        <div class="brand brand-light"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
        <div class="login-story-copy"><p class="eyebrow eyebrow-light">One connected workspace</p><h1 id="welcome-title">Plan every detail.<br>Keep every team aligned.</h1><p>Move events from request to readiness with a clear, role-specific view of the work that matters to you.</p></div>
        <p class="login-support">ConnectSphere Event Services</p>
      </section>
      <section class="login-panel" aria-labelledby="sign-in-title"><div class="login-card">
        <div class="mobile-brand brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
        <p class="eyebrow">Secure workspace</p><h2 id="sign-in-title">Welcome back</h2><p class="subtle">Sign in with your organisation account to continue.</p>
        <div x-show="alert && alert.message" x-cloak class="alert alert-error login-alert" role="alert"><span class="alert-icon" aria-hidden="true">!</span><span x-text="alert && alert.message"></span></div>
        <form class="login-form" @submit.prevent="login(loginForm.username, loginForm.password)" :aria-busy="loading"><fieldset class="login-fields" :disabled="loading">
          <div class="field-group"><label for="username">Username</label><input id="username" x-model.trim="loginForm.username" required autocomplete="username" placeholder="Enter your username" :aria-invalid="!!fieldErrors.username" aria-describedby="username-error"><small id="username-error" class="field-error" x-text="fieldErrors.username"></small></div>
          <div class="field-group"><label for="password">Password</label><div class="password-field"><input id="password" x-model="loginForm.password" required :type="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="Enter your password" :aria-invalid="!!fieldErrors.password" aria-describedby="password-error"><button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" x-text="showPassword ? 'Hide' : 'Show'"></button></div><small id="password-error" class="field-error" x-text="fieldErrors.password"></small></div>
          <button class="button button-primary button-block" :disabled="loading" :aria-busy="loading"><span x-show="loading" class="spinner" aria-hidden="true"></span><span x-text="loading ? 'Signing in…' : 'Sign in to workspace'"></span></button>
        </fieldset></form><p class="sr-only" role="status" x-text="loading ? 'Signing in' : ''"></p><p class="login-note">Your access is tailored to your assigned role.</p>
      </div></section>
    </main>
  </template>

  <template x-if="user"><div class="app-shell" :class="{ 'nav-open': sidebarOpen, 'sidebar-collapsed': sidebarCollapsed && !compactNav }" @keydown.escape.window="if (sidebarOpen) { sidebarOpen = false; $refs.menuButton?.focus(); }">
    <div class="mobile-scrim" x-show="sidebarOpen" x-transition.opacity @click="sidebarOpen = false" aria-hidden="true"></div>
    <aside id="app-sidebar" class="sidebar" aria-label="Application sidebar">
      <div class="sidebar-brand brand brand-light"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
      <nav class="side-nav" aria-label="Main navigation"><p class="nav-section-label">Menu</p>
        <template x-for="item in navigation" :key="item.path"><button x-show="canAccess(item.role, user.role)" @click="navigate(item.path); sidebarOpen = false" class="nav-item" :class="currentPath === item.path ? 'active' : ''" :title="sidebarCollapsed && !compactNav ? item.label : null" :aria-current="currentPath === item.path ? 'page' : null"><span class="nav-icon" aria-hidden="true" x-html="iconFor(item.icon)"></span><span class="nav-label" x-text="item.label"></span></button></template>
      </nav>
      <div class="sidebar-footer"><div class="role-card"><span class="avatar" aria-hidden="true" x-text="userInitials()"></span><span class="role-card-copy"><strong x-text="user.username"></strong><small x-text="user.role"></small></span></div><button class="signout-button" @click="logout()" :title="sidebarCollapsed && !compactNav ? 'Sign out' : null"><span aria-hidden="true" x-html="iconFor('logout')"></span><span class="signout-label">Sign out</span></button></div>
    </aside>
    <section class="app-area">
      <header class="topbar"><div class="topbar-start"><button type="button" class="sidebar-toggle icon-control" x-ref="menuButton" @click="toggleSidebar()" :aria-expanded="sidebarExpanded()" aria-controls="app-sidebar" :aria-label="sidebarExpanded() ? 'Collapse sidebar' : 'Expand sidebar'" :title="sidebarExpanded() ? 'Collapse sidebar' : 'Expand sidebar'" x-html="iconFor(compactNav ? 'menu' : 'panel-left')"></button><div class="breadcrumb"><span>ConnectSphere</span><b aria-hidden="true">/</b><strong x-text="pageTitle()"></strong></div></div><div class="topbar-actions"><div class="notification-center" @click.outside="notificationOpen = false"><button type="button" class="notification-trigger icon-control" @click="notificationOpen = !notificationOpen" :aria-expanded="notificationOpen" aria-controls="notification-panel" aria-label="Open notifications"><span x-html="iconFor('bell')"></span><b x-show="unreadNotifications()" x-text="unreadNotifications() > 9 ? '9+' : unreadNotifications()"></b></button><section id="notification-panel" class="notification-panel" x-show="notificationOpen" x-cloak x-transition role="region" aria-label="Notifications"><header><div><h2>Notifications</h2><p x-text="unreadNotifications() ? `${unreadNotifications()} unread` : 'You’re all caught up'"></p></div><button type="button" class="icon-button" @click="notificationOpen = false" aria-label="Close notifications">×</button></header><div class="notification-empty" x-show="!notifications.length"><span x-html="iconFor('bell')"></span><strong>No notifications yet</strong><p>Updates about your events and bookings will appear here.</p></div><ul x-show="notifications.length"><template x-for="notification in notifications" :key="notification.id"><li class="notification-item" :class="[notification.read ? 'is-read' : 'is-unread', `tone-${notificationTone(notification)}`]"><div class="notification-main" :class="notificationTarget(notification) ? 'has-target' : ''"><span class="notification-kind-icon" aria-hidden="true" x-html="iconFor(notificationIcon(notification))"></span><span class="notification-copy"><span class="notification-heading"><template x-if="notificationTarget(notification)"><button type="button" class="notification-open" @click="openNotification(notification)" :aria-label="`${notificationTitle(notification)}: ${notificationTarget(notification).label.toLowerCase()}`" x-text="notificationTitle(notification)"></button></template><template x-if="!notificationTarget(notification)"><strong x-text="notificationTitle(notification)"></strong></template><i x-show="!notification.read" role="img" aria-label="Unread"></i></span><span class="notification-message" x-text="formatNotificationMessage(notification)"></span><span class="notification-meta"><time x-text="formatNotificationTime(notification.created_at)"></time><span class="notification-link" x-show="notificationTarget(notification)" aria-hidden="true" x-text="`${notificationTarget(notification)?.label} ›`"></span></span></span></div><button class="mark-read" x-show="!notification.read" @click.stop="markNotificationRead(notification)">Mark as read</button></li></template></ul></section></div><span class="timezone-note" title="All dates and times are Singapore time (UTC+8)">Times in SGT</span></div></header>
      <main id="main-content" class="main-content" tabindex="-1">
        <div x-show="alert && alert.message && alert.kind !== 'success'" x-cloak class="alert content-alert" :class="alert && alert.kind === 'info' ? 'alert-info' : 'alert-error'" :role="alert && alert.kind === 'info' ? 'status' : 'alert'"><span class="alert-icon" aria-hidden="true" x-text="alert && alert.kind === 'info' ? 'i' : '!'"></span><span x-text="alert && alert.message"></span><button type="button" class="icon-button" @click="clearAlert()" aria-label="Dismiss message">×</button></div>
        <div x-show="loading" x-cloak class="loading-bar" role="status"><i></i><span>Updating your workspace…</span></div>

        <template x-if="accessDenied"><section class="state-card"><div class="state-icon danger">!</div><p class="eyebrow">Restricted area</p><h1>Access denied</h1><p>This account does not have permission to view that function. Your <strong x-text="user.role"></strong> workspace only shows functions assigned to you.</p><button class="button button-primary" @click="navigate(defaultPath())">Return to my workspace</button></section></template>
        <template x-if="currentPath === '/venue' && isVenueStaff() && venueWorkspace"><section class="operations-page">
          <div class="page-header"><div><p class="eyebrow">Venue Staff workspace</p><h1>Venue operations</h1><p>Review requests requiring attention and keep the venue catalogue accurate.</p></div><button class="button button-primary" @click="toggleVenueCreate()" :disabled="venueWriteBusy()"><span aria-hidden="true">＋</span> Add venue</button></div>
          <section class="state-card compact" x-show="venueWorkspace.denied" role="alert"><div class="state-icon danger">!</div><h2>You can't manage venues</h2><p x-text="venueWorkspace.error"></p></section>
          <div class="inline-state error request-load-error" x-show="venueWorkspace.error && !venueWorkspace.denied" role="alert"><span x-text="venueWorkspace.loaded ? `Couldn't refresh venues and bookings: ${venueWorkspace.error}` : `Couldn't load venues and bookings: ${venueWorkspace.error}`"></span><button type="button" class="button button-secondary button-compact" :disabled="venueWorkspace.busy" @click="fetchVenueWorkspace()">Try again</button></div>
          <div class="inline-state" x-show="!venueWorkspace.loaded && !venueWorkspace.error" role="status"><span class="spinner dark" aria-hidden="true"></span> Loading venues and bookings…</div>
          <template x-if="venueWorkspace.loaded && !venueWorkspace.denied"><div class="venue-workspace">
          <!-- [SCRUM-92 | Elnathan] One form for Add venue and Edit, with all nine venue fields (AC1, AC2). -->
          <form class="create-venue-card" x-show="venueWorkspace.showCreate" x-transition @submit.prevent="saveVenueForm()" novalidate :aria-label="venueWorkspace.editing ? 'Edit venue' : 'Add venue'">
            <div class="section-heading"><div><span class="section-icon" x-html="iconFor('building')"></span><div><h2 x-text="venueWorkspace.editing ? `Edit ${venueWorkspace.editing.name}` : 'Add a venue'"></h2><p x-text="venueWorkspace.editing ? 'Only the fields you change are saved.' : 'Make a new space available for event booking.'"></p></div></div><button type="button" class="icon-button" @click="cancelVenueForm()" :disabled="venueWriteBusy()" aria-label="Close venue form">×</button></div>
            <p class="form-message" x-show="venueWorkspace.formMessage" :class="venueWorkspace.formMessage?.kind" :role="venueWorkspace.formMessage?.kind === 'error' ? 'alert' : 'status'" x-text="venueWorkspace.formMessage?.text"></p>
            <fieldset :disabled="venueWriteBusy()">
              <div class="venue-form-grid">
                <div class="field-group"><label for="venue-name">Venue name</label><input id="venue-name" x-model="venueWorkspace.form.name" required placeholder="e.g. Harbour Ballroom" :aria-invalid="!!fieldErrors.name"><small class="field-error" x-text="fieldErrors.name"></small></div>
                <div class="field-group"><label for="venue-location">Location</label><input id="venue-location" x-model="venueWorkspace.form.location" required placeholder="Building or address" :aria-invalid="!!fieldErrors.location"><small class="field-error" x-text="fieldErrors.location"></small></div>
                <div class="field-group"><label for="venue-capacity">Capacity</label><input id="venue-capacity" x-model="venueWorkspace.form.capacity" type="number" min="1" step="1" required placeholder="Maximum guests" :aria-invalid="!!fieldErrors.capacity"><small class="field-error" x-text="fieldErrors.capacity"></small></div>
                <div class="field-group field-wide"><label for="venue-facilities">Facilities</label><input id="venue-facilities" x-model="venueWorkspace.form.facilities" placeholder="e.g. Projector, Stage, WiFi" aria-describedby="venue-list-help" :aria-invalid="!!fieldErrors.facilities"><small class="field-error" x-text="fieldErrors.facilities"></small></div>
                <div class="field-group"><label for="venue-layouts">Supported layouts</label><input id="venue-layouts" x-model="venueWorkspace.form.supported_layouts" placeholder="e.g. Theatre, Banquet" aria-describedby="venue-list-help" :aria-invalid="!!fieldErrors.supported_layouts"><small class="field-error" x-text="fieldErrors.supported_layouts"></small></div>
                <div class="field-group field-wide"><label for="venue-accessibility">Accessibility</label><input id="venue-accessibility" x-model="venueWorkspace.form.accessibility" placeholder="e.g. Step-free entrance, hearing loop" :aria-invalid="!!fieldErrors.accessibility"><small class="field-error" x-text="fieldErrors.accessibility"></small></div>
                <div class="field-group"><label for="venue-hours">Operating hours</label><input id="venue-hours" x-model="venueWorkspace.form.operating_hours" placeholder="e.g. Mon-Fri 08:00-22:00" :aria-invalid="!!fieldErrors.operating_hours"><small class="field-error" x-text="fieldErrors.operating_hours"></small></div>
                <div class="field-group"><label for="venue-setup">Setup time (minutes)</label><input id="venue-setup" x-model="venueWorkspace.form.setup_time_mins" type="number" min="0" step="1" required :aria-invalid="!!fieldErrors.setup_time_mins"><small class="field-error" x-text="fieldErrors.setup_time_mins"></small></div>
                <div class="field-group"><label for="venue-turnaround">Turnaround time (minutes)</label><input id="venue-turnaround" x-model="venueWorkspace.form.turnaround_time_mins" type="number" min="0" step="1" required :aria-invalid="!!fieldErrors.turnaround_time_mins"><small class="field-error" x-text="fieldErrors.turnaround_time_mins"></small></div>
              </div>
              <p id="venue-list-help" class="form-help">Separate facilities and layouts with commas. Leave an optional field empty to clear it.</p>
              <div class="panel-actions"><button type="button" class="button button-secondary" @click="cancelVenueForm()">Cancel</button><button class="button button-primary" :disabled="venueWorkspace.busy || venueWriteBusy()"><span x-show="venueWorkspace.saving" class="spinner"></span><span x-text="venueWorkspace.saving ? 'Saving…' : venueWorkspace.editing ? 'Save changes' : 'Save venue'"></span></button></div>
            </fieldset>
          </form>
          <!-- [SCRUM-92 | Elnathan] Retire asks here, in the page, never in a browser dialog (AC4, D6). -->
          <template x-if="venueWorkspace.retire"><section class="venue-notice warning" role="region" aria-labelledby="venue-retire-title">
            <h2 id="venue-retire-title" tabindex="-1" x-init="$nextTick(() => $el.focus())" x-text="`Retire ${venueWorkspace.retire.venue.name}?`"></h2>
            <p>Coordinators and Leads will no longer be able to find or request it, and it leaves the venue catalogue. Nothing is deleted, but there's no way to bring a retired venue back in the app.</p>
            <template x-if="!retireImpactKnown(venueWorkspace.retire.venue)"><p class="form-message error" role="status">This venue's bookings couldn't be loaded, so the bookings it holds can't be listed. The backend lists them once the venue is retired.</p></template>
            <template x-if="retireImpactKnown(venueWorkspace.retire.venue)"><div>
              <p x-show="!retireImpact(venueWorkspace.retire.venue).length">No pending or upcoming confirmed bookings hold this venue.</p>
              <template x-if="retireImpact(venueWorkspace.retire.venue).length"><div><p x-text="`${retireImpact(venueWorkspace.retire.venue).length === 1 ? 'This booking holds' : `These ${retireImpact(venueWorkspace.retire.venue).length} bookings hold`} the venue. They won't be cancelled or notified, and they'll leave Booking requests, so pending ones can't be decided here.`"></p>
                <ul class="booking-list"><template x-for="booking in retireImpact(venueWorkspace.retire.venue)" :key="booking.id"><li><div><strong x-text="booking.event_title"></strong><small class="venue-notice-detail" x-text="`#${booking.id} · ${formatSchedule(booking.booking_start, booking.booking_end)}`"></small></div><span class="status-badge" :class="bookingStatusClass(booking.status)"><i></i><span x-text="booking.status"></span></span></li></template></ul></div></template>
            </div></template>
            <p class="form-message error" role="alert" x-show="venueWorkspace.retire.error" x-text="venueWorkspace.retire.error"></p>
            <div class="panel-actions"><button type="button" class="button button-secondary" @click="cancelRetireVenue()" :disabled="venueWorkspace.retire.busy">Cancel</button><button type="button" class="button button-danger" @click="confirmRetireVenue()" :disabled="venueWriteBusy()"><span x-show="venueWorkspace.retire.busy" class="spinner"></span><span x-text="venueWorkspace.retire.busy ? 'Retiring…' : 'Retire venue'"></span></button></div>
          </section></template>
          <!-- [SCRUM-92 | Elnathan] What a save or a retire changed: newly flagged bookings (AC3, D5) or affected bookings (AC4, D6). -->
          <template x-if="venueWorkspace.outcome"><section class="venue-notice" aria-live="polite">
            <div class="venue-notice-heading"><h2 x-text="`${venueWorkspace.outcome.venueName} ${venueWorkspace.outcome.kind === 'retired' ? 'retired' : 'updated'}`"></h2><button type="button" class="icon-button" @click="dismissVenueOutcome()" aria-label="Dismiss">×</button></div>
            <template x-if="venueWorkspace.outcome.kind === 'updated' && venueWorkspace.outcome.bufferChanged"><div>
              <p x-show="!venueWorkspace.outcome.flagged.length">No bookings were newly flagged by this change.</p>
              <template x-if="venueWorkspace.outcome.flagged.length"><div><p>These bookings now clash once the new setup and turnaround times are included. They are flagged, not changed.</p>
                <ul class="booking-list"><template x-for="row in venueWorkspace.outcome.flagged" :key="row.id"><li><div><strong x-text="row.eventTitle"></strong><small class="venue-notice-detail" x-text="`${row.venueName} · ${formatSchedule(row.start, row.end)}`"></small><small class="venue-notice-detail" x-text="row.reason"></small></div><span class="status-badge badge-attention"><i></i><span>Flagged</span></span></li></template></ul></div></template>
            </div></template>
            <template x-if="venueWorkspace.outcome.kind === 'retired'"><div>
              <p x-show="!venueWorkspace.outcome.affected.length">No upcoming bookings held this venue.</p>
              <template x-if="venueWorkspace.outcome.affected.length"><div><p>These bookings weren't cancelled, but they have left Booking requests.</p>
                <ul class="booking-list"><template x-for="row in venueWorkspace.outcome.affected" :key="row.id"><li><div><strong x-text="row.eventTitle"></strong><small class="venue-notice-detail" x-text="formatSchedule(row.start, row.end)"></small></div><span class="status-badge" :class="bookingStatusClass(row.status)"><i></i><span x-text="row.status"></span></span></li></template></ul></div></template>
            </div></template>
          </section></template>
          <div class="operations-grid">
            <section class="queue-panel booking-queue-panel" aria-labelledby="venue-requests-title"><div class="queue-heading"><div><h2 id="venue-requests-title">Booking requests</h2><p>Requests waiting for a decision come first. Open a booking from its event name for the venue, hold and history.</p></div><button class="button button-secondary button-compact" :disabled="venueWorkspace.busy" :aria-busy="venueWorkspace.busy" @click="fetchVenueWorkspace()"><span class="spinner dark" x-show="venueWorkspace.busy" aria-hidden="true"></span><span x-text="venueWorkspace.busy ? 'Refreshing…' : 'Refresh'"></span></button></div><div class="list-controls list-controls-inset" x-data="{ key: 'bookings' }"><div class="list-controls-row" :class="listControls(key).sorts ? '' : 'no-sort'"><div class="field-group list-search"><label :for="`${key}-search`">Search</label><input type="search" :id="`${key}-search`" x-model="listControls(key).view.query" :placeholder="listControls(key).placeholder" @keydown.escape.stop="listControls(key).query && clearListSearch(key)"></div><template x-if="listControls(key).sorts"><div class="select-field list-sort"><label :for="`${key}-sort`" x-text="listControls(key).sortLabel"></label><select :id="`${key}-sort`" x-model="listControls(key).view.sort"><template x-for="option in listControls(key).sorts" :key="option.value"><option :value="option.value" :selected="option.value === listControls(key).view.sort" x-text="option.label"></option></template></select></div></template></div><template x-if="listControls(key).chips"><div class="filter-chips" role="group" :aria-label="listControls(key).label"><template x-for="chip in listControls(key).chips" :key="chip.key"><button type="button" @click="listControls(key).filter.target[listControls(key).filter.key] = chip.key" :class="listControls(key).filter.target[listControls(key).filter.key] === chip.key ? 'active' : ''" :aria-pressed="listControls(key).filter.target[listControls(key).filter.key] === chip.key"><span x-text="chip.label"></span><b x-text="chip.count"></b></button></template></div></template><p class="sr-only" role="status" x-text="listControls(key).announce"></p><div class="empty-panel card list-no-match" x-show="listControls(key).query && !listControls(key).shown"><span x-html="iconFor('inbox')"></span><strong x-text="listControls(key).noMatch"></strong><p>Try different words, or clear the search to see everything in this filter.</p><button type="button" class="button button-secondary button-compact" @click="clearListSearch(key)">Clear search</button></div></div><div class="inline-state error request-load-error" x-show="venueWorkspace.bookingError" role="alert"><span>Some venues' bookings couldn't be loaded, so this list may be incomplete.</span><button type="button" class="button button-secondary button-compact" :disabled="venueWorkspace.busy" @click="fetchVenueWorkspace()">Try again</button></div><div class="empty-panel" x-show="!venueWorkspace.bookingError && !venueWorkspace.bookings.length"><span x-html="iconFor('inbox')"></span><strong>No booking requests</strong><p>New requests will appear here for review.</p></div><div class="empty-panel filtered-empty" x-show="venueWorkspace.bookings.length && !bookingView.query.trim() && !filteredVenueBookings().length"><span x-html="iconFor('inbox')"></span><strong x-text="`No ${venueWorkspace.bookingFilter.toLowerCase()} requests`"></strong><p>Choose another filter to view booking activity.</p></div>
              <template x-for="group in venueBookingGroups()" :key="group.key"><section class="booking-group table-container" :class="group.key === 'decide' ? 'booking-group-attention' : ''" :aria-labelledby="`booking-group-${group.key}`">
                <div class="booking-group-heading"><h3 :id="`booking-group-${group.key}`"><span x-text="group.title"></span> <span class="group-count" x-text="group.bookings.length"></span></h3><p x-text="group.hint"></p></div>
                <table class="data-table venue-booking-table"><thead><tr><th scope="col">Booking</th><th scope="col">Date and time</th><th scope="col">Status</th><th scope="col" class="cell-end">Actions</th></tr></thead>
                  <tbody><template x-for="booking in group.bookings" :key="booking.id"><tr :class="group.key === 'decide' ? 'needs-attention' : ''">
                    <td data-label="Booking" class="booking-cell-main"><a class="row-link" :href="`#booking-${booking.id}`" @click.prevent="openStaffBooking(booking.id)" x-text="booking.event_title"></a><small><span x-text="`#${booking.id}`"></span> · <span x-text="booking.venue_name"></span> · <span x-text="booking.requester_name || 'Requester not recorded'"></span></small><template x-if="booking.conflict_flag"><p class="booking-row-note"><span class="row-flag">Possible clash</span> <span x-text="booking.conflict_flag.reason"></span></p></template><template x-if="booking.status === 'Pending' && bookingEnded(booking)"><span class="row-flag">Booking time passed</span></template><template x-if="booking.rejection_reason"><p class="booking-row-note"><strong>Rejection reason:</strong> <span x-text="booking.rejection_reason"></span></p></template></td>
                    <td data-label="Date and time" class="booking-cell-when cell-inline"><span x-text="formatSchedule(booking.booking_start, booking.booking_end)"></span><template x-if="booking.hold_expires_at && ['Pending', 'Expired'].includes(booking.status)"><small x-text="`Hold ${booking.status === 'Expired' ? 'expired' : 'expires'} ${formatHoldExpiry(booking.hold_expires_at)}`"></small></template></td>
                    <td data-label="Status" class="cell-inline"><span class="status-badge" :class="bookingStatusClass(booking.status)"><i></i><span x-text="booking.status"></span></span></td>

        <template x-if="eventDetail.equipment.items.length"><div class="table-container equipment-list"><table class="data-table equipment-table"><thead><tr><th scope="col">Equipment</th><th scope="col" class="cell-number">Quantity</th><th scope="col">Technical requirements</th><th scope="col">Recorded</th></tr></thead>
          <tbody><template x-for="item in eventDetail.equipment.items" :key="item.id"><tr><td data-label="Equipment" class="equipment-cell-type" x-text="item.equipment_type"></td><td data-label="Quantity" class="cell-number" x-text="item.quantity"></td><td data-label="Technical requirements" class="equipment-cell-notes"><span :class="item.technical_requirements ? '' : 'cell-empty'" x-text="item.technical_requirements || 'None recorded'"></span></td><td data-label="Recorded" class="equipment-cell-recorded"><span x-text="item.requested_by || 'Unknown'"></span><small x-text="formatUtc(item.created_at)"></small></td></tr></template></tbody></table></div></template>
        <template x-if="eventDetail.equipment.loaded && !eventDetail.equipment.denied && canRecordEquipment(eventDetail.detail)"><form class="equipment-form" @submit.prevent="addEquipment()" novalidate><fieldset :disabled="eventDetail.equipment.busy"><legend class="venue-search-heading">Add equipment</legend>
          <p class="form-message error" role="alert" x-show="eventDetail.equipment.errors.form" x-text="eventDetail.equipment.errors.form"></p>
          <div class="equipment-form-grid"><div class="field-group"><label for="equipment-type">Equipment type</label><input id="equipment-type" maxlength="100" x-model="eventDetail.equipment.form.equipment_type" placeholder="e.g. Wireless microphone" :aria-invalid="!!eventDetail.equipment.errors.equipment_type" aria-describedby="equipment-type-error"><small id="equipment-type-error" class="field-error" x-text="eventDetail.equipment.errors.equipment_type"></small></div>
          <div class="field-group"><label for="equipment-quantity">Quantity</label><input id="equipment-quantity" type="number" min="1" step="1" inputmode="numeric" x-model="eventDetail.equipment.form.quantity" placeholder="e.g. 2" :aria-invalid="!!eventDetail.equipment.errors.quantity" aria-describedby="equipment-quantity-error"><small id="equipment-quantity-error" class="field-error" x-text="eventDetail.equipment.errors.quantity"></small></div></div>
          <div class="field-group"><label for="equipment-notes">Technical requirements <em>Optional</em></label><textarea id="equipment-notes" rows="2" x-model="eventDetail.equipment.form.technical_requirements" placeholder="e.g. HDMI input, spare batteries"></textarea></div>
          <div class="dialog-form-actions dialog-form-actions-end"><button type="submit" class="button button-primary" :aria-busy="eventDetail.equipment.busy"><span class="spinner" x-show="eventDetail.equipment.busy" aria-hidden="true"></span><span x-text="eventDetail.equipment.busy ? 'Adding…' : 'Add equipment'"></span></button></div>
        </fieldset></form></template>
        <template x-if="eventDetail.equipment.loaded && !eventDetail.equipment.denied && !canRecordEquipment(eventDetail.detail)"><p class="form-help">Only the assigned Coordinator or a Lead can add equipment to this event.</p></template>
      </section></template></div></template></div>
    </section></div></template>

    <template x-if="staffBooking && isVenueStaff()"><div class="modal-backdrop" @click.self="staffBooking = null" @keydown.escape.window="staffBooking = null"><section class="modal-card booking-dialog review-dialog" role="dialog" aria-modal="true" aria-labelledby="staff-booking-title" x-init="$nextTick(() => $el.querySelector('button').focus())"><div class="modal-header"><div><p class="eyebrow">Venue booking</p><h2 id="staff-booking-title" x-text="staffBooking.detail && staffBooking.detail.status !== 'Pending' ? 'Booking details' : 'Review request'">Review request</h2></div><button class="icon-button" @click="staffBooking = null" aria-label="Close booking review">×</button></div><div class="modal-body"><div class="inline-state" x-show="staffBooking.busy" role="status"><span class="spinner dark"></span> Loading booking details…</div><div class="inline-state error" x-show="!staffBooking.busy && !staffBooking.detail">Booking details could not be loaded. Close this dialog and try again.</div>
      <template x-if="staffBooking.detail"><div class="review-content"><div class="dialog-error" role="alert" x-show="staffBooking.error" x-effect="staffBooking?.error && $nextTick(() => $el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }))"><span x-html="iconFor('alert')"></span><span x-text="staffBooking.error"></span></div><div class="review-title"><span class="venue-monogram" aria-hidden="true" x-text="initials(staffBooking.detail.venue?.name)"></span><div><p>Venue</p><h3 x-text="staffBooking.detail.venue?.name"></h3></div><span class="status-badge" :class="bookingStatusClass(staffBooking.detail.status)"><i></i><span x-text="staffBooking.detail.status"></span></span></div><dl class="booking-detail-grid"><div><dt>Event</dt><dd x-text="staffBooking.detail.event_title"></dd></div><div><dt>Requester</dt><dd x-text="requesterLabel(staffBooking.detail)"></dd></div><div class="wide"><dt>Schedule</dt><dd x-text="formatSchedule(staffBooking.detail.booking_start, staffBooking.detail.booking_end)"></dd></div><div><dt>Capacity</dt><dd x-text="staffBooking.detail.venue?.capacity ? `${staffBooking.detail.venue?.capacity} people` : 'Not recorded'"></dd></div><div><dt>Layouts</dt><dd x-text="listText(staffBooking.detail.venue?.supported_layouts)"></dd></div><div class="wide"><dt>Accessibility</dt><dd x-text="staffBooking.detail.venue?.accessibility || 'Not recorded'"></dd></div><div class="wide"><dt>Facilities</dt><dd x-text="listText(staffBooking.detail.venue?.facilities)"></dd></div><div><dt>Hold expires</dt><dd x-text="staffBooking.detail.hold_expires_at ? `${formatUtc(staffBooking.detail.hold_expires_at)}` : 'No hold'"></dd></div><div><dt>Coordinator warning</dt><dd x-text="staffBooking.detail.warning_minutes != null ? `${staffBooking.detail.warning_minutes} min before expiry` : 'Not set'"></dd></div></dl><div class="conflict-callout" role="note" x-show="staffBooking.detail.conflict_flag"><strong>Possible clash</strong><span x-text="staffBooking.detail.conflict_flag?.reason"></span></div><div class="rejection-callout" x-show="staffBooking.detail.rejection_reason"><strong>Rejection reason</strong><span x-text="staffBooking.detail.rejection_reason"></span></div>
      <template x-if="staffBooking.detail.status === 'Pending'"><form class="hold-form" @submit.prevent="setStaffHold()" novalidate><div class="field-group"><label for="staff-hold-expiry">Set or extend the hold <em>Before the booking starts</em></label><input id="staff-hold-expiry" type="datetime-local" x-model="staffBooking.holdExpiry" :disabled="staffBooking.busy" :aria-invalid="!!fieldErrors.holdExpiry"><small class="field-error" x-text="fieldErrors.holdExpiry"></small></div><button type="submit" class="button button-secondary" :disabled="staffBooking.busy">Update hold</button></form></template>
      <template x-if="staffBooking.detail.status === 'Pending'"><form class="decision-form" @submit.prevent="decideStaffBooking('reject')" novalidate><fieldset :disabled="staffBooking.busy"><div class="decision-heading"><h4>Record a decision</h4><p>Approve the requested schedule, or provide a clear reason for rejection.</p></div><div class="field-group"><label for="staff-rejection-reason">Rejection reason <em>Required only when rejecting</em></label><textarea id="staff-rejection-reason" x-init="staffBooking.focusReason && $nextTick(() => $el.focus())" x-model="staffBooking.reason" rows="4" :aria-invalid="!!fieldErrors.reason" placeholder="Explain why this venue or schedule cannot be approved."></textarea><small class="field-error" x-text="fieldErrors.reason"></small></div><div class="modal-actions"><button type="submit" class="button button-danger-quiet">Reject request</button><button type="button" class="button button-success" @click="decideStaffBooking('approve')"><span x-html="iconFor('check')"></span> Approve booking</button></div></fieldset></form></template></div></template>
    </div></section></div></template>
    <!-- [SCRUM-96 | Melvin] Venue availability calendar, day by day (SCRUM-32 AC1-AC4). -->
    <template x-if="venueCalendar"><div class="modal-backdrop" @click.self="closeVenueCalendar()" @keydown.escape.window="closeVenueCalendar()"><section class="modal-card booking-dialog" role="dialog" aria-modal="true" aria-labelledby="venue-calendar-title" x-init="$nextTick(() => $el.querySelector('button').focus())">
      <div class="modal-header"><div><p class="eyebrow" x-text="venueCalendar.venue.name"></p><h2 id="venue-calendar-title">Availability calendar</h2></div><button class="icon-button" @click="closeVenueCalendar()" aria-label="Close the availability calendar">&times;</button></div>
      <div class="modal-body">
        <div class="dialog-error" role="alert" x-show="venueCalendar.error"><span x-html="iconFor('alert')"></span><span x-text="venueCalendar.error"></span></div>
        <form class="venue-search-form venue-search-box" @submit.prevent="fetchVenueCalendar()" novalidate>
          <div class="date-time-grid">
            <div class="field-group"><label for="calendar-from">From</label><input id="calendar-from" type="date" x-model="venueCalendar.from" required></div>
            <div class="field-group"><label for="calendar-to">To</label><input id="calendar-to" type="date" x-model="venueCalendar.to" required></div>
          </div>
          <p class="form-help">Up to 31 days at a time.</p>
          <button type="submit" class="button button-primary button-compact" :disabled="venueCalendar.busy" x-text="venueCalendar.busy ? 'Loading...' : 'Show calendar'"></button>
        </form>
        <div class="inline-state" x-show="venueCalendar.busy" role="status"><span class="spinner dark"></span> Loading the calendar&hellip;</div>
        <template x-if="venueCalendar.data && !venueCalendar.busy"><div>
          <dl class="booking-detail-grid"><div><dt>Operating hours</dt><dd x-text="venueCalendar.data.operating_hours || 'Not recorded'"></dd></div><div><dt>Showing</dt><dd x-text="`${calendarDayLabel(venueCalendar.data.from)} to ${calendarDayLabel(venueCalendar.data.to)}`"></dd></div></dl>
          <p class="form-help" x-text="calendarBufferNote()"></p>
          <ul class="booking-list"><template x-for="day in venueCalendar.days" :key="day.date"><li class="calendar-day">
            <div><strong x-text="calendarDayLabel(day.date)"></strong><p x-text="`Operating hours: ${calendarHours(day)}`"></p></div>
            <p x-show="calendarDayIsFree(day)" class="subtle">No bookings. The venue can be requested on this day.</p>
            <ul class="calendar-blocks" x-show="!calendarDayIsFree(day)"><template x-for="block in day.busy" :key="`${day.date}-${block.event_id}-${block.booked_start}`"><li>
              <span class="status-badge" :class="bookingStatusClass(block.status)"><i></i><span x-text="block.status"></span></span>
              <p>Booked: <span x-text="formatSchedule(block.booked_start, block.booked_end)"></span></p>
              <p>Occupied: <span x-text="formatSchedule(block.occupied_start, block.occupied_end)"></span></p>
            </li></template></ul>
          </li></template></ul>
          <p x-show="!venueCalendar.days.length" role="status">No days to show for this range.</p>
        </div></template>
      </div>
    </section></div></template>

    <template x-if="bookingDialog"><div class="modal-backdrop" @keydown.escape.window="closeBookings()" @click.self="closeBookings()"><section class="modal-card booking-dialog" role="dialog" aria-modal="true" aria-labelledby="booking-title" x-init="$nextTick(() => $el.querySelector('button').focus())">
      <div class="modal-header"><div><p class="eyebrow" x-text="bookingDialog.event.title"></p><h2 id="booking-title">Venue bookings</h2></div><button class="icon-button" @click="closeBookings()" aria-label="Close venue bookings">×</button></div>
      <div class="modal-body">
        <p x-show="alert?.message" role="status" x-text="alert?.message"></p>
        <div class="inline-state" x-show="bookingDialog.busy" role="status"><span class="spinner dark"></span> Loading bookings…</div>
        <section class="dialog-section" aria-labelledby="booking-history-title">
        <div class="dialog-section-heading"><div><h3 id="booking-history-title">Booking history</h3><p>Existing requests for this event.</p></div><button type="button" class="button button-secondary button-compact" :disabled="bookingDialog.busy" @click="openBookings(bookingDialog.event)">Refresh</button></div>
        <p x-show="!bookingDialog.busy && !bookingDialog.bookingsLoaded" role="status">Booking history could not be loaded. You can still request a venue if venues are available.</p>
        <p x-show="bookingDialog.bookingsLoaded && !bookingDialog.bookings.length">No booking requests yet.</p>
        <ul class="booking-list"><template x-for="booking in bookingDialog.bookings" :key="booking.id"><li><div><strong x-text="booking.venue_name"></strong><p x-text="formatSchedule(booking.booking_start, booking.booking_end)"></p></div><span class="status-badge" :class="bookingStatusClass(booking.status)"><i></i><span x-text="booking.status"></span></span><div x-show="booking.status === 'Pending' || booking.status === 'Expired'"><p>Hold expiry: <span x-text="formatHoldExpiry(booking.hold_expires_at)"></span></p><p>Warning: <span x-text="booking.warning_minutes == null ? 'Not set' : `${booking.warning_minutes} minutes before expiry`"></span></p></div><template x-if="canUpdateHoldWarning(booking)"><form @submit.prevent="updateHoldWarning(booking)" novalidate><fieldset :disabled="bookingDialog.warningBusy !== null"><div class="field-group"><label :for="`hold-warning-${booking.id}`">Warning lead time (minutes)</label><input :id="`hold-warning-${booking.id}`" type="number" min="0" step="1" required x-model="bookingDialog.warningInputs[booking.id]" :aria-invalid="!!bookingDialog.warningErrors[booking.id]"><small class="field-error" x-text="bookingDialog.warningErrors[booking.id]"></small></div><button class="button button-secondary button-compact" type="submit" :disabled="bookingDialog.warningBusy !== null" x-text="bookingDialog.warningBusy === booking.id ? 'Saving...' : 'Save warning'"></button></fieldset></form></template><p class="rejection-callout" x-show="booking.rejection_reason"><strong>Rejection reason</strong><span x-text="booking.rejection_reason"></span></p></li></template></ul>
        </section>

        <section class="dialog-section" aria-labelledby="find-venues-title">
        <div class="dialog-section-heading"><div><h3 id="find-venues-title">Find and assess venues</h3><p>Search by any of these fields, or check which venues suit this event.</p></div></div>
        <form class="venue-search-form venue-search-box" @submit.prevent="searchVenues()" novalidate>
          <p class="form-message error" role="alert" x-show="bookingDialog.searchErrors.form" x-text="bookingDialog.searchErrors.form"></p>
          <div class="date-time-grid"><div class="field-group"><label for="search-start">Search start</label><input id="search-start" type="datetime-local" x-model="bookingDialog.search.start_time" :aria-invalid="!!bookingDialog.searchErrors.start_time" aria-describedby="search-start-error"><small id="search-start-error" class="field-error" x-text="bookingDialog.searchErrors.start_time"></small></div><div class="field-group"><label for="search-end">Search end</label><input id="search-end" type="datetime-local" x-model="bookingDialog.search.end_time" :aria-invalid="!!bookingDialog.searchErrors.end_time" aria-describedby="search-end-error"><small id="search-end-error" class="field-error" x-text="bookingDialog.searchErrors.end_time"></small></div></div>
          <div class="date-time-grid"><div class="field-group"><label for="search-capacity">Min capacity</label><input id="search-capacity" type="number" x-model="bookingDialog.search.min_capacity" :aria-invalid="!!bookingDialog.searchErrors.min_capacity" aria-describedby="search-capacity-error" min="1" step="1" inputmode="numeric" placeholder="e.g. 100"><small id="search-capacity-error" class="field-error" x-text="bookingDialog.searchErrors.min_capacity"></small></div><div class="field-group"><label for="search-location">Location</label><input id="search-location" type="text" x-model.trim="bookingDialog.search.location" :aria-invalid="!!bookingDialog.searchErrors.location" aria-describedby="search-location-error" placeholder="e.g. Building 2"><small id="search-location-error" class="field-error" x-text="bookingDialog.searchErrors.location"></small></div></div>
          <div class="date-time-grid"><div class="field-group"><label for="search-layout">Layout</label><input id="search-layout" type="text" x-model.trim="bookingDialog.search.layout" :aria-invalid="!!bookingDialog.searchErrors.layout" aria-describedby="search-layout-error" placeholder="e.g. Theatre"><small id="search-layout-error" class="field-error" x-text="bookingDialog.searchErrors.layout"></small></div><div class="field-group"><label for="search-accessibility">Accessibility</label><input id="search-accessibility" type="text" x-model.trim="bookingDialog.search.accessibility" :aria-invalid="!!bookingDialog.searchErrors.accessibility" aria-describedby="search-accessibility-error" placeholder="e.g. Wheelchair"><small id="search-accessibility-error" class="field-error" x-text="bookingDialog.searchErrors.accessibility"></small></div></div>
          <div class="field-group"><label for="search-facilities">Facilities</label><input id="search-facilities" type="text" placeholder="e.g. Projector, Audio" x-model.trim="bookingDialog.search.facilities" :aria-invalid="!!bookingDialog.searchErrors.facilities" aria-describedby="search-facilities-help search-facilities-error" :disabled="bookingDialog.noFacilitiesRequired"><small id="search-facilities-help" class="form-help">Separate them with commas.</small><small id="search-facilities-error" class="field-error" x-text="bookingDialog.searchErrors.facilities"></small>
            <label class="venue-search-check"><input type="checkbox" x-model="bookingDialog.noFacilitiesRequired" @change="bookingDialog.searchErrors = { ...bookingDialog.searchErrors, facilities: '' }"> No facilities required (for the suitability check)</label></div>
          <div class="field-group"><label class="venue-search-check"><input type="checkbox" x-model="bookingDialog.search.available_only" :aria-invalid="!!bookingDialog.searchErrors.available_only" aria-describedby="search-available-error"> Available only</label><small id="search-available-error" class="field-error" x-text="bookingDialog.searchErrors.available_only"></small></div>
          <div class="dialog-form-actions">
            <p class="form-help">Check suitability compares every venue with this event's expected attendance and the facilities above.</p>
            <div class="venue-search-btns">
              <button type="button" class="button button-secondary" :disabled="bookingDialog.checkingSuitability" :aria-busy="bookingDialog.checkingSuitability" @click="checkSuitability(bookingDialog.search.facilities)"><span class="spinner dark" x-show="bookingDialog.checkingSuitability" aria-hidden="true"></span><span x-text="bookingDialog.checkingSuitability ? 'Checking…' : 'Check suitability'"></span></button>
              <button type="submit" class="button button-primary" :disabled="bookingDialog.searching" :aria-busy="bookingDialog.searching"><span class="spinner" x-show="bookingDialog.searching" aria-hidden="true"></span><span x-text="bookingDialog.searching ? 'Searching…' : 'Search venues'"></span></button>
            </div>
          </div>
        </form>

        <div class="dialog-results" aria-live="polite">
          <div class="dialog-error" role="alert" x-show="bookingDialog.resultsKind === 'search' && bookingDialog.searchError"><span x-html="iconFor('alert')"></span><span x-text="bookingDialog.searchError"></span></div>
          <div class="dialog-error" role="alert" x-show="bookingDialog.resultsKind === 'suitability' && bookingDialog.suitabilityError"><span x-html="iconFor('alert')"></span><span x-text="bookingDialog.suitabilityError"></span></div>
          <p class="form-message info" role="status" x-show="bookingDialog.resultsKind === 'search' && bookingDialog.searchMessage" x-text="bookingDialog.searchMessage"></p>
          <p class="form-message info" role="status" x-show="bookingDialog.resultsKind === 'suitability' && bookingDialog.suitabilityMessage" x-text="bookingDialog.suitabilityMessage"></p>
          <template x-if="bookingDialog.resultsKind === 'search' && bookingDialog.searchResults.length">
            <div>
              <h4 class="venue-search-heading" x-text="`Search results (${bookingDialog.searchResults.length})`"></h4>
              <ul class="booking-list">
                <template x-for="venue in bookingDialog.searchResults" :key="venue.id">
                  <li>
                    <div>
                      <strong x-text="venue.name"></strong>
                      <p x-text="`Capacity ${venue.capacity} · ${venue.location || 'Location not set'}`"></p>
                      <div class="conflict-callout search-conflict-callout" x-show="venue.conflict_reason"><strong>Conflict</strong><span x-text="venue.conflict_reason"></span></div>
                    </div>
                    <div class="search-result-side">
                      <span class="status-badge" :class="availabilityClass(venue.is_available)"><i></i><span x-text="venue.is_available ? 'Available' : 'Unavailable'"></span></span>
                      <button type="button" class="button button-secondary button-compact" @click="openVenueCalendar(venue)" :aria-label="`View the availability calendar for ${venue.name}`">Calendar</button>
                      <template x-if="canRequestFromSearch(venue)"><button type="button" class="button button-secondary button-compact" @click="selectVenueFromSearch(venue)" :aria-label="`Request ${venue.name}`">Request this venue</button></template>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </template>
          <template x-if="bookingDialog.resultsKind === 'suitability' && bookingDialog.suitabilityResults.length">
            <div>
              <h4 class="venue-search-heading" x-text="`Suitability results (${bookingDialog.suitabilityResults.length})`"></h4>
              <ul class="booking-list">
                <template x-for="item in bookingDialog.suitabilityResults" :key="item.id || item.venue_id">
                  <li>
                    <div>
                      <strong x-text="item.name || item.venue_name"></strong>
                      <ul class="suitability-check-list"><template x-for="chk in item.checks" :key="chk.check"><li x-text="`${chk.check}: ${chk.result || chk.status} (${chk.detail})`"></li></template></ul>
                    </div>
                    <span class="status-badge" :class="suitabilityBadgeClass(item.suitability)"><i></i><span x-text="suitabilityLabel(item.suitability)"></span></span>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>
        </section>

        <section class="dialog-section" aria-labelledby="request-venue-title">
        <form class="request-booking-form" @submit.prevent="submitBooking()" novalidate>
          <fieldset :disabled="bookingDialog.submitting"><legend class="sr-only" x-text="bookingDialog.bookings.length ? 'Request another venue' : 'Request a venue'"></legend>
            <div class="dialog-section-heading"><div><h3 id="request-venue-title" x-text="bookingDialog.bookings.length ? 'Request another venue' : 'Request a venue'"></h3><p>Choose a venue and the full booking window, in Singapore time.</p></div></div>
            <p class="form-message info" role="status" x-show="bookingDialog.requestMessage" x-text="bookingDialog.requestMessage"></p>
            <p x-show="bookingDialog.ready && !bookingDialog.venues.length" role="status">No venues available. Please contact Venue Staff to add a venue.</p>
            <p x-show="!bookingDialog.busy && !bookingDialog.ready" role="status">Venues could not be loaded. Refresh bookings to try again.</p>
            <div class="field-group"><label for="booking-venue">Venue</label><select id="booking-venue" x-model="bookingDialog.form.venue_id" required :aria-invalid="!!fieldErrors.venue_id" aria-describedby="booking-venue-error"><option value="">Select a venue</option><template x-for="venue in bookingDialog.venues" :key="venue.id"><option :value="venue.id" :selected="String(venue.id) === String(bookingDialog.form.venue_id)" x-text="venue.name"></option></template></select><small id="booking-venue-error" class="field-error" x-text="fieldErrors.venue_id"></small></div>
            <div class="date-time-grid"><div class="field-group"><label for="booking-start">Start date and time</label><input id="booking-start" type="datetime-local" x-model="bookingDialog.form.booking_start" required :aria-invalid="!!fieldErrors.booking_start" aria-describedby="booking-start-error"><small id="booking-start-error" class="field-error" x-text="fieldErrors.booking_start"></small></div><div class="field-group"><label for="booking-end">End date and time</label><input id="booking-end" type="datetime-local" x-model="bookingDialog.form.booking_end" required :aria-invalid="!!fieldErrors.booking_end" aria-describedby="booking-end-error"><small id="booking-end-error" class="field-error" x-text="fieldErrors.booking_end"></small></div></div>
            <div class="dialog-error" role="alert" x-show="bookingDialog.error" x-effect="bookingDialog?.error && $nextTick(() => $el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }))"><span x-html="iconFor('alert')"></span><span x-text="bookingDialog.error"></span></div>
            <div class="dialog-form-actions dialog-form-actions-end"><button class="button button-primary" type="submit" :disabled="bookingDialog.busy || !bookingDialog.ready" :aria-busy="bookingDialog.submitting"><span class="spinner" x-show="bookingDialog.submitting" aria-hidden="true"></span><span x-text="bookingDialog.submitting ? 'Submitting…' : 'Submit booking request'"></span></button></div>
          </fieldset>
        </form>
        </section>
      </div>
    </section></div></template>
    <template x-if="modal.open"><div class="modal-backdrop" @keydown.escape.window="closeModal()" @click.self="closeModal()"><section class="modal-card" :class="modal.kind === 'amend' ? 'amend-dialog' : ''" role="dialog" aria-modal="true" aria-labelledby="modal-title" x-transition><div class="modal-header"><div><p class="eyebrow" x-text="modal.event ? `Event request #${modal.event.id} · ${modal.event.title}` : 'Event request'"></p><h2 id="modal-title" x-text="modal.kind === 'reject' ? 'Reject request' : modal.kind === 'return' ? 'Request clarification' : 'Edit request'"></h2></div><button type="button" class="icon-button" @click="closeModal()" aria-label="Close dialog">×</button></div><form @submit.prevent="submitModal()"><fieldset :disabled="decisionBusy" style="border:0;padding:0;margin:0;min-width:0">
      <template x-if="modal.kind === 'amend'"><div class="modal-body"><div x-show="alert && alert.message" x-cloak class="alert" :class="alert && alert.kind === 'info' ? 'alert-info' : 'alert-error'" role="alert"><span x-text="alert && alert.message"></span></div><template x-if="modal.event?.status === 'Returned'"><template x-if="clarificationNote(modal.event)"><div class="callout clarification-note" :class="clarificationNote(modal.event).kind === 'question' ? 'callout-attention' : 'callout-neutral'"><strong x-text="clarificationNote(modal.event).heading"></strong><span x-text="clarificationNote(modal.event).text"></span><template x-if="clarificationNote(modal.event).detail"><small x-text="clarificationNote(modal.event).detail"></small></template></div></template></template><p class="form-help" x-text="modal.resubmit ? 'Edit the details to answer the Coordinator. Save keeps your changes without sending the request back. Resubmit saves any changes and sends it back to the Coordinator for review.' : 'Only the fields you change are saved. The request stays with its Coordinator.'"></p><div class="inline-state" x-show="modal.loading" role="status"><span class="spinner dark"></span> Loading request details…</div><div class="dialog-error" role="alert" x-show="modal.loadError"><span x-text="modal.loadError"></span></div><fieldset :disabled="!!modal.loading || !!modal.loadError" style="border:0;padding:0;margin:0;min-width:0"><div class="field-group"><label for="amend-title">Event title <em>Required</em></label><input id="amend-title" x-model.trim="amendForm.title" required :aria-invalid="fieldErrors.title ? 'true' : 'false'" aria-describedby="amend-title-error"><small id="amend-title-error" class="field-error" x-text="fieldErrors.title"></small></div><div class="field-group"><label for="amend-purpose">Purpose</label><textarea id="amend-purpose" x-model="amendForm.purpose" rows="2" placeholder="What should this event achieve?"></textarea></div><div class="field-group"><label for="amend-description">Description</label><textarea id="amend-description" x-model="amendForm.description" rows="3" placeholder="Share the format, audience, and any useful context."></textarea></div><div class="date-time-grid"><div class="field-group"><label for="amend-start">Proposed start</label><input id="amend-start" x-model="amendForm.proposed_start" type="datetime-local" :aria-invalid="fieldErrors.proposed_start ? 'true' : 'false'" aria-describedby="amend-start-help amend-start-error"><small id="amend-start-help" class="form-help">Singapore time (SGT).</small><small id="amend-start-error" class="field-error" x-text="fieldErrors.proposed_start"></small></div><div class="field-group"><label for="amend-attendance">Expected attendance</label><input id="amend-attendance" x-model.number="amendForm.expected_attendance" type="number" min="1" inputmode="numeric" placeholder="e.g. 120" :aria-invalid="fieldErrors.expected_attendance ? 'true' : 'false'" aria-describedby="amend-attendance-error"><small id="amend-attendance-error" class="field-error" x-text="fieldErrors.expected_attendance"></small></div></div><div class="field-group"><label for="amend-venue-requirements">Venue</label><textarea id="amend-venue-requirements" x-model="amendForm.venue_requirements" rows="2" placeholder="Room layout, accessibility, catering, breakout spaces…"></textarea></div><div class="field-group"><label for="amend-accessibility-needs">Accessibility</label><textarea id="amend-accessibility-needs" x-model="amendForm.accessibility_needs" rows="2" placeholder="Wheelchair access, live captioning, assistive listening…"></textarea></div><div class="field-group"><label for="amend-equipment-requirements">Equipment</label><textarea id="amend-equipment-requirements" x-model="amendForm.equipment_requirements" rows="2" placeholder="Microphones, projectors, screens, video conferencing…"></textarea></div><div class="field-group"><label for="amend-registration-needs">Registration and check-in</label><textarea id="amend-registration-needs" x-model="amendForm.registration_needs" rows="2" placeholder="Pre-printed badges, on-site check-in tables, QR scanners…"></textarea></div></fieldset></div></template>
      <template x-if="modal.kind !== 'amend'"><div class="modal-body"><p class="form-help" x-text="modal.kind === 'reject' ? 'Explain the decision clearly so the organiser understands the outcome.' : 'Describe exactly what information the organiser needs to provide.'"></p><div class="field-group"><label for="decision-reason">Reason <em>Required</em></label><textarea id="decision-reason" x-model.trim="decisionForm.reason" rows="5" required :aria-invalid="fieldErrors.reason ? 'true' : 'false'" placeholder="Provide a concise, actionable explanation."></textarea><small class="field-error" x-text="fieldErrors.reason"></small><p class="field-error" role="alert" x-text="fieldErrors.form"></p></div></div></template>
      <div class="modal-actions"><span class="change-count" role="status" x-show="modal.kind === 'amend' && !modal.loading && !modal.loadError" x-text="amendChangeCount() === 0 ? 'No changes yet' : amendChangeCount() === 1 ? '1 field changed' : `${amendChangeCount()} fields changed`"></span><button type="button" @click="closeModal()" class="button button-secondary">Cancel</button><template x-if="modal.kind === 'amend' && modal.resubmit && amendChangeCount()"><button type="button" class="button button-secondary" :disabled="!!modal.loading || !!modal.loadError" :aria-busy="decisionBusy && modal.action === 'save'" @click="amendEvent(modal.event.id, amendForm)"><span class="spinner dark" x-show="decisionBusy && modal.action === 'save'" aria-hidden="true"></span><span x-text="decisionBusy && modal.action === 'save' ? 'Saving…' : 'Save'"></span></button></template><button class="button" :class="modal.kind === 'reject' ? 'button-danger' : 'button-primary'" :disabled="modal.kind === 'amend' && (!!modal.loading || !!modal.loadError || (!modal.resubmit && !amendChangeCount()))" :aria-busy="decisionBusy && (modal.kind !== 'amend' || modal.action === (modal.resubmit ? 'resubmit' : 'save'))"><span class="spinner" x-show="decisionBusy && (modal.kind !== 'amend' || modal.action === (modal.resubmit ? 'resubmit' : 'save'))" aria-hidden="true"></span><span x-text="modal.kind === 'amend' ? (modal.resubmit ? (decisionBusy && modal.action === 'resubmit' ? 'Resubmitting…' : 'Resubmit') : (decisionBusy && modal.action === 'save' ? 'Saving…' : 'Save')) : modal.kind === 'reject' ? 'Reject request' : 'Send clarification request'"></span></button></div>
    </fieldset></form></section></div></template>
  </div></template>
</div>
</body></html>
