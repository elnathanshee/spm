<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12362f">
  <title>ConnectSphere · Event operations</title><script type="module" src="/src/main.js"></script>
  <style>.skip-link{position:fixed;top:-100px}.skip-link:focus{top:1rem}</style>
</head>
<body>
<div x-data="appState()" x-init="init()" class="min-h-screen">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <template x-if="!user">
    <main class="login-shell">
      <section class="login-story" aria-labelledby="welcome-title">
        <div class="brand brand-light"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
        <div class="login-story-copy"><p class="eyebrow eyebrow-light">One connected workspace</p><h1 id="welcome-title">Plan every detail.<br>Keep every team aligned.</h1><p>Move events from request to readiness with a clear, role-specific view of the work that matters to you.</p></div>
        <p class="login-support">ConnectSphere Event Services</p>
      </section>
      <section class="login-panel" aria-labelledby="sign-in-title"><div class="login-card">
        <div class="mobile-brand brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
        <p class="eyebrow">Secure workspace</p><h2 id="sign-in-title">Welcome back</h2><p class="subtle">Sign in with your organisation account to continue.</p>
        <div x-show="alert && alert.message" x-cloak class="alert alert-error mt-6" role="alert"><span class="alert-icon" aria-hidden="true">!</span><span x-text="alert && alert.message"></span></div>
        <form class="login-form" @submit.prevent="login(loginForm.username, loginForm.password)">
          <div class="field-group"><label for="username">Username</label><input id="username" x-model.trim="loginForm.username" required autocomplete="username" placeholder="Enter your username"></div>
          <div class="field-group"><label for="password">Password</label><div class="password-field"><input id="password" x-model="loginForm.password" required :type="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="Enter your password"><button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" x-text="showPassword ? 'Hide' : 'Show'"></button></div></div>
          <button class="button button-primary button-block" :disabled="loading" :aria-busy="loading"><span x-show="loading" class="spinner" aria-hidden="true"></span><span x-text="loading ? 'Signing in…' : 'Sign in to workspace'"></span></button>
        </form><p class="login-note"><span>●</span> Your access is tailored to your assigned role.</p>
      </div></section>
    </main>
  </template>

  <template x-if="user"><div class="app-shell" :class="sidebarOpen ? 'nav-open' : ''">
    <div class="mobile-scrim" x-show="sidebarOpen" x-transition.opacity @click="sidebarOpen = false" aria-hidden="true"></div>
    <aside class="sidebar" aria-label="Application sidebar">
      <div class="sidebar-brand brand brand-light"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>ConnectSphere</strong><small>Event services</small></span></div>
      <div class="workspace-label"><span>Workspace</span><strong x-text="roleWorkspace()"></strong></div>
      <nav class="side-nav" aria-label="Main navigation"><p class="nav-section-label">Menu</p>
        <template x-for="item in navigation" :key="item.path"><button x-show="canAccess(item.role, user.role)" @click="navigate(item.path); sidebarOpen = false" class="nav-item" :class="currentPath === item.path ? 'active' : ''" :aria-current="currentPath === item.path ? 'page' : null"><span class="nav-icon" aria-hidden="true" x-html="iconFor(item.icon)"></span><span x-text="item.label"></span></button></template>
      </nav>
      <div class="sidebar-footer"><div class="role-card"><span class="avatar" x-text="userInitials()"></span><span class="role-card-copy"><strong x-text="user.username"></strong><small x-text="user.role"></small></span></div><button class="signout-button" @click="logout()"><span x-html="iconFor('logout')"></span> Sign out</button></div>
    </aside>
    <section class="app-area">
      <header class="topbar"><button class="menu-button" @click="sidebarOpen = !sidebarOpen" :aria-expanded="sidebarOpen" aria-label="Toggle navigation"><i></i><i></i><i></i></button><div class="breadcrumb"><span>ConnectSphere</span><b>/</b><strong x-text="pageTitle()"></strong></div><div class="topbar-actions"><div class="notification-center" @click.outside="notificationOpen = false"><button class="notification-trigger" @click="notificationOpen = !notificationOpen" :aria-expanded="notificationOpen" aria-controls="notification-panel" aria-label="Open notifications"><span x-html="iconFor('bell')"></span><b x-show="unreadNotifications()" x-text="unreadNotifications() > 9 ? '9+' : unreadNotifications()"></b></button><section id="notification-panel" class="notification-panel" x-show="notificationOpen" x-cloak x-transition role="region" aria-label="Notifications"><header><div><h2>Notifications</h2><p x-text="unreadNotifications() ? `${unreadNotifications()} unread` : 'You’re all caught up'"></p></div><button @click="notificationOpen = false" aria-label="Close notifications">×</button></header><div class="notification-empty" x-show="!notifications.length"><span x-html="iconFor('bell')"></span><strong>No notifications yet</strong><p>Updates about your events and bookings will appear here.</p></div><ul x-show="notifications.length"><template x-for="notification in notifications" :key="notification.id"><li class="notification-item" :class="[notification.read ? 'is-read' : 'is-unread', `tone-${notificationTone(notification)}`]"><button class="notification-main" @click="openNotification(notification)"><span class="notification-kind-icon" x-html="iconFor(notificationIcon(notification))"></span><span class="notification-copy"><span class="notification-heading"><strong x-text="notificationTitle(notification)"></strong><i x-show="!notification.read" aria-label="Unread"></i></span><span class="notification-message" x-text="formatNotificationMessage(notification)"></span><time x-text="formatNotificationTime(notification.created_at)"></time></span></button><button class="mark-read" x-show="!notification.read" @click.stop="markNotificationRead(notification)">Mark as read</button></li></template></ul></section></div><div class="topbar-user"><i></i><span x-text="user.role"></span></div></div></header>
      <main id="main-content" class="main-content" tabindex="-1">
        <div x-show="alert && alert.message" x-cloak class="alert content-alert" :class="alert && alert.kind === 'error' ? 'alert-error' : 'alert-success'" role="status"><span class="alert-icon" x-text="alert && alert.kind === 'error' ? '!' : '✓'"></span><span x-text="alert && alert.message"></span><button @click="clearAlert()" aria-label="Dismiss message">×</button></div>
        <div x-show="loading" x-cloak class="loading-bar" role="status"><i></i><span>Updating your workspace…</span></div>

        <template x-if="accessDenied"><section class="state-card"><div class="state-icon danger">!</div><p class="eyebrow">Restricted area</p><h1>Access denied</h1><p>This account does not have permission to view that function. Your <strong x-text="user.role"></strong> workspace only shows functions assigned to you.</p><button class="button button-primary" @click="navigate(defaultPath())">Return to my workspace</button></section></template>
        <template x-if="currentPath === '/venue' && isVenueStaff() && venueWorkspace"><section class="operations-page">
          <div class="page-header"><div><p class="eyebrow">Venue Staff workspace</p><h1>Venue operations</h1><p>Review requests requiring attention and keep the venue catalogue accurate.</p></div><button class="button button-primary" @click="toggleVenueCreate()" :disabled="venueWriteBusy()"><span aria-hidden="true">＋</span> Add venue</button></div>
          <div class="summary-strip operations-summary" aria-label="Venue operations summary"><div><span>Active venues<small>Available to book</small></span><strong x-text="venueWorkspace.venues.length"></strong></div><div><span>Pending requests<small>Awaiting your review</small></span><strong x-text="venueWorkspace.bookings.filter(booking => booking.status === 'Pending').length"></strong></div><div><span>Unread updates<small>New activity</small></span><strong x-text="unreadNotifications()"></strong></div></div>
          <!-- [SCRUM-92 | Elnathan] One form for Add venue and Edit, with all nine venue fields (AC1, AC2). -->
          <form class="create-venue-card" x-show="venueWorkspace.showCreate" x-transition @submit.prevent="saveVenueForm()" novalidate :aria-label="venueWorkspace.editing ? 'Edit venue' : 'Add venue'">
            <div class="section-heading"><div><span class="section-icon" x-html="iconFor('building')"></span><div><h2 x-text="venueWorkspace.editing ? `Edit ${venueWorkspace.editing.name}` : 'Add a venue'"></h2><p x-text="venueWorkspace.editing ? 'Only the fields you change are saved.' : 'Make a new space available for event booking.'"></p></div></div><button type="button" class="icon-button" @click="cancelVenueForm()" :disabled="venueWriteBusy()" aria-label="Close venue form">×</button></div>
            <p class="form-message" x-show="venueWorkspace.formMessage" :class="venueWorkspace.formMessage?.kind" :role="venueWorkspace.formMessage?.kind === 'error' ? 'alert' : 'status'" x-text="venueWorkspace.formMessage?.text"></p>
            <fieldset :disabled="venueWriteBusy()">
              <div class="venue-form-grid">
                <div class="field-group"><label for="venue-name">Venue name</label><input id="venue-name" x-model="venueWorkspace.form.name" required placeholder="e.g. Harbour Ballroom" :aria-invalid="!!fieldErrors.name"><small class="field-error" x-text="fieldErrors.name"></small></div>
                <div class="field-group"><label for="venue-location">Location</label><input id="venue-location" x-model="venueWorkspace.form.location" required placeholder="Building or address" :aria-invalid="!!fieldErrors.location"><small class="field-error" x-text="fieldErrors.location"></small></div>
                <div class="field-group"><label for="venue-capacity">Capacity</label><input id="venue-capacity" x-model="venueWorkspace.form.capacity" type="number" min="1" step="1" required placeholder="Maximum guests" :aria-invalid="!!fieldErrors.capacity"><small class="field-error" x-text="fieldErrors.capacity"></small></div>
                <div class="field-group field-wide"><label for="venue-facilities">Facilities</label><input id="venue-facilities" x-model="venueWorkspace.form.facilities" placeholder="e.g. Projector, Stage, WiFi" aria-describedby="venue-list-help" :aria-invalid="!!fieldErrors.facilities"><small class="field-error" x-text="fieldErrors.facilities"></small></div>
                <div class="field-group"><label for="venue-layouts">Supported layouts</label><input id="venue-layouts" x-model="venueWorkspace.form.supported_layouts" placeholder="e.g. Theatre, Banquet" aria-describedby="venue-list-help" :aria-invalid="!!fieldErrors.supported_layouts"><small class="field-error" x-text="fieldErrors.supported_layouts"></small></div>
                <div class="field-group field-wide"><label for="venue-accessibility">Accessibility</label><input id="venue-accessibility" x-model="venueWorkspace.form.accessibility" placeholder="e.g. Step-free entrance, hearing loop" :aria-invalid="!!fieldErrors.accessibility"><small class="field-error" x-text="fieldErrors.accessibility"></small></div>
                <div class="field-group"><label for="venue-hours">Operating hours</label><input id="venue-hours" x-model="venueWorkspace.form.operating_hours" placeholder="e.g. Mon-Fri 08:00-22:00" :aria-invalid="!!fieldErrors.operating_hours"><small class="field-error" x-text="fieldErrors.operating_hours"></small></div>
                <div class="field-group"><label for="venue-setup">Setup time (minutes)</label><input id="venue-setup" x-model="venueWorkspace.form.setup_time_mins" type="number" min="0" step="1" required :aria-invalid="!!fieldErrors.setup_time_mins"><small class="field-error" x-text="fieldErrors.setup_time_mins"></small></div>
                <div class="field-group"><label for="venue-turnaround">Turnaround time (minutes)</label><input id="venue-turnaround" x-model="venueWorkspace.form.turnaround_time_mins" type="number" min="0" step="1" required :aria-invalid="!!fieldErrors.turnaround_time_mins"><small class="field-error" x-text="fieldErrors.turnaround_time_mins"></small></div>
              </div>
              <p id="venue-list-help" class="form-help">Separate facilities and layouts with commas. Leave an optional field empty to clear it.</p>
              <div class="panel-actions"><button type="button" class="button button-secondary" @click="cancelVenueForm()">Cancel</button><button class="button button-primary" :disabled="venueWorkspace.busy || venueWriteBusy()"><span x-show="venueWorkspace.saving" class="spinner"></span><span x-text="venueWorkspace.saving ? 'Saving…' : venueWorkspace.editing ? 'Save changes' : 'Save venue'"></span></button></div>
            </fieldset>
          </form>
          <!-- [SCRUM-92 | Elnathan] Retire asks here, in the page, never in a browser dialog (AC4, D6). -->
          <template x-if="venueWorkspace.retire"><section class="venue-notice warning" role="region" aria-labelledby="venue-retire-title">
            <h2 id="venue-retire-title" tabindex="-1" x-init="$nextTick(() => $el.focus())" x-text="`Retire ${venueWorkspace.retire.venue.name}?`"></h2>
            <p>Coordinators and Leads will no longer be able to request it. Its bookings won't be cancelled, but they will leave Booking requests.</p>
            <p class="form-message error" role="alert" x-show="venueWorkspace.retire.error" x-text="venueWorkspace.retire.error"></p>
            <div class="panel-actions"><button type="button" class="button button-secondary" @click="cancelRetireVenue()" :disabled="venueWorkspace.retire.busy">Cancel</button><button type="button" class="button button-danger" @click="confirmRetireVenue()" :disabled="venueWriteBusy()"><span x-show="venueWorkspace.retire.busy" class="spinner"></span><span x-text="venueWorkspace.retire.busy ? 'Retiring…' : 'Retire venue'"></span></button></div>
          </section></template>
          <!-- [SCRUM-92 | Elnathan] What a save or a retire changed: newly flagged bookings (AC3, D5) or affected bookings (AC4, D6). -->
          <template x-if="venueWorkspace.outcome"><section class="venue-notice" aria-live="polite">
            <div class="venue-notice-heading"><h2 x-text="`${venueWorkspace.outcome.venueName} ${venueWorkspace.outcome.kind === 'retired' ? 'retired' : 'updated'}`"></h2><button type="button" class="icon-button" @click="dismissVenueOutcome()" aria-label="Dismiss">×</button></div>
            <template x-if="venueWorkspace.outcome.kind === 'updated' && venueWorkspace.outcome.bufferChanged"><div>
              <p x-show="!venueWorkspace.outcome.flagged.length">No bookings were newly flagged by this change.</p>
              <template x-if="venueWorkspace.outcome.flagged.length"><div><p>These bookings now clash once the new setup and turnaround times are included. They are flagged, not changed.</p>
                <ul class="booking-list"><template x-for="row in venueWorkspace.outcome.flagged" :key="row.id"><li><div><strong x-text="row.eventTitle"></strong><small class="venue-notice-detail" x-text="`${row.venueName} · ${formatSchedule(row.start, row.end)}`"></small><small class="venue-notice-detail" x-text="row.reason"></small></div><span class="status-badge status-waiting"><i></i><span>Flagged</span></span></li></template></ul></div></template>
            </div></template>
            <template x-if="venueWorkspace.outcome.kind === 'retired'"><div>
              <p x-show="!venueWorkspace.outcome.affected.length">No upcoming bookings held this venue.</p>
              <template x-if="venueWorkspace.outcome.affected.length"><div><p>These bookings weren't cancelled, but they have left Booking requests.</p>
                <ul class="booking-list"><template x-for="row in venueWorkspace.outcome.affected" :key="row.id"><li><div><strong x-text="row.eventTitle"></strong><small class="venue-notice-detail" x-text="formatSchedule(row.start, row.end)"></small></div><span class="status-badge" :class="bookingStatusClass(row.status)"><i></i><span x-text="row.status"></span></span></li></template></ul></div></template>
            </div></template>
          </section></template>
          <div class="operations-grid">
            <section class="queue-panel booking-queue-panel" aria-labelledby="venue-requests-title"><div class="queue-heading"><div><h2 id="venue-requests-title">Booking requests</h2><p>Review pending requests and scan the complete booking history.</p></div><button class="button button-secondary button-compact" :disabled="venueWorkspace.busy" @click="fetchVenueWorkspace()">Refresh</button></div><div class="booking-filters" role="group" aria-label="Filter booking requests"><template x-for="filter in ['All', 'Pending', 'Confirmed', 'Rejected', 'Expired']" :key="filter"><button type="button" @click="venueWorkspace.bookingFilter = filter" :class="venueWorkspace.bookingFilter === filter ? 'active' : ''" :aria-pressed="venueWorkspace.bookingFilter === filter"><span x-text="filter"></span><b x-text="bookingFilterCount(filter)"></b></button></template></div><div class="inline-state" x-show="venueWorkspace.busy" role="status"><span class="spinner dark"></span> Loading requests…</div><div class="inline-state error" x-show="venueWorkspace.bookingError" role="status">Some requests could not be loaded. Refresh to try again.</div><div class="empty-panel" x-show="venueWorkspace.loaded && !venueWorkspace.busy && !venueWorkspace.bookingError && !venueWorkspace.bookings.length"><span x-html="iconFor('inbox')"></span><strong>No booking requests</strong><p>New requests will appear here for review.</p></div><div class="empty-panel filtered-empty" x-show="venueWorkspace.loaded && !venueWorkspace.busy && venueWorkspace.bookings.length && !filteredVenueBookings().length"><span x-html="iconFor('inbox')"></span><strong x-text="`No ${venueWorkspace.bookingFilter.toLowerCase()} requests`"></strong><p>Choose another filter to view booking activity.</p></div><div class="booking-table" x-show="filteredVenueBookings().length"><div class="booking-table-head" aria-hidden="true"><span>Event and venue</span><span>Date and time</span><span>Status</span><span>Action</span></div><template x-for="booking in filteredVenueBookings()" :key="booking.id"><article class="booking-row" :class="booking.status === 'Pending' ? 'needs-action' : ''"><div class="booking-title"><span class="venue-monogram" x-text="booking.venue_name?.charAt(0)"></span><div><strong x-text="booking.event_title"></strong><small><span class="mobile-field-label">Venue · </span><span x-text="booking.venue_name"></span></small></div></div><div class="booking-schedule"><span x-html="iconFor('calendar')"></span><span><span class="mobile-field-label">Date · </span><span x-text="formatSchedule(booking.booking_start, booking.booking_end)"></span></span></div><div class="booking-status"><span class="mobile-field-label">Status · </span><span class="status-badge" :class="bookingStatusClass(booking.status)"><i></i><span x-text="booking.status"></span></span></div><div class="booking-action"><button class="button" :class="booking.status === 'Pending' ? 'button-primary' : 'button-secondary'" @click="openStaffBooking(booking.id)" x-text="booking.status === 'Pending' ? 'Review request' : 'View details'"></button></div><p class="rejection-callout" x-show="booking.rejection_reason"><strong>Rejection reason</strong><span x-text="booking.rejection_reason"></span></p></article></template></div></section>
            <section class="queue-panel venue-catalogue" aria-labelledby="venue-list-title"><div class="queue-heading"><div><h2 id="venue-list-title">Venue catalogue</h2><p>Spaces currently available to request.</p></div><span class="total-count" x-text="`${venueWorkspace.venues.length} total`"></span></div><div class="inline-state error" x-show="!venueWorkspace.busy && !venueWorkspace.loaded" role="status">Venues could not be loaded.</div><div class="empty-panel" x-show="venueWorkspace.loaded && !venueWorkspace.venues.length"><span x-html="iconFor('building')"></span><strong>No venues yet</strong><p>Add a venue to make it available for booking.</p></div><div class="venue-list-head" x-show="venueWorkspace.venues.length" aria-hidden="true"><span>Venue</span><span>Location</span><span>Capacity</span></div><ul class="venue-list"><template x-for="venue in venueWorkspace.venues" :key="venue.id"><li><span class="venue-identity"><span class="venue-monogram" x-text="venue.name?.charAt(0)"></span><strong x-text="venue.name"></strong></span><span class="venue-location"><small>Location</small><span x-text="venue.location"></span></span><span class="capacity"><small>Capacity</small><span><b x-text="venue.capacity"></b> people</span></span>
                <!-- [SCRUM-92 | Elnathan] The rest of the venue record, and Edit and Retire (AC2, AC4, AC5). -->
                <div class="venue-record">
                  <dl class="venue-meta">
                    <div><dt>Facilities</dt><dd><template x-for="(item, index) in venue.facilities || []" :key="index"><span class="venue-tag" x-text="item"></span></template><span x-show="!venue.facilities?.length">None listed</span></dd></div>
                    <div><dt>Layouts</dt><dd><template x-for="(item, index) in venue.supported_layouts || []" :key="index"><span class="venue-tag" x-text="item"></span></template><span x-show="!venue.supported_layouts?.length">None listed</span></dd></div>
                    <div><dt>Accessibility</dt><dd x-text="venue.accessibility || 'Not recorded'"></dd></div>
                    <div><dt>Hours</dt><dd x-text="venue.operating_hours || 'Not recorded'"></dd></div>
                    <div><dt>Buffers</dt><dd x-text="venueBufferSummary(venue)"></dd></div>
                  </dl>
                  <div class="venue-actions"><button type="button" class="button button-secondary button-compact" @click="openVenueEdit(venue)" :disabled="venueWriteBusy()" :aria-label="`Edit ${venue.name}`">Edit</button><button type="button" class="button button-danger-quiet button-compact" @click="askRetireVenue(venue)" :disabled="venueWriteBusy()" :aria-label="`Retire ${venue.name}`">Retire</button></div>
                </div>
              </li></template></ul></section>
          </div>
        </section></template>
        <template x-if="unbuiltRole"><section><div class="page-header"><div><p class="eyebrow" x-text="`${user.role} workspace`"></p><h1 x-text="rolePageHeading()"></h1><p x-text="rolePageDescription()"></p></div></div><div class="state-card role-state"><div class="state-icon" x-html="iconFor(roleIcon())"></div><h2>Your focused workspace is ready</h2><p x-text="roleEmptyMessage()"></p><div class="permission-note"><b>✓</b><span><strong>Role-based access is active.</strong><br>Internal planning tools are kept separate from this workspace.</span></div></div></section></template>

        <template x-if="currentPath === '/events' && user.role === 'Organiser'"><section>
          <div class="page-header"><div><p class="eyebrow">Organiser workspace</p><h1>Your event requests</h1><p>Track progress, respond to clarifications, and start a new request.</p></div><button @click="navigate('/events/new')" class="button button-primary"><span>＋</span> New request</button></div>
          <div class="summary-strip" aria-label="Event request summary"><div><span>All requests</span><strong x-text="events.length"></strong></div><div><span>Need attention</span><strong x-text="events.filter(event => ['Draft', 'Returned'].includes(event.status)).length"></strong></div><div><span>In review</span><strong x-text="events.filter(event => ['Submitted', 'Under Review'].includes(event.status)).length"></strong></div></div>
          <div x-show="events.length === 0 && !loading" class="state-card compact"><div class="state-icon" x-html="iconFor('calendar')"></div><h2>No event requests yet</h2><p>Create your first request to begin planning with the ConnectSphere team.</p><button class="button button-primary" @click="navigate('/events/new')">Create event request</button></div>
          <div class="event-grid"><template x-for="event in events" :key="event.id"><article class="event-card">
            <div class="event-card-top"><div><p class="card-kicker">Event request <span x-text="`#${event.id}`"></span></p><h2 x-text="event.title"></h2></div><span class="status-badge" :class="statusClass(event.status)"><i></i><span x-text="event.status"></span></span></div>
            <dl class="event-meta"><div><dt><span x-html="iconFor('calendar')"></span>Proposed date</dt><dd x-text="formatDate(event.proposed_start)"></dd></div><div><dt><span x-html="iconFor('people')"></span>Attendance</dt><dd x-text="event.expected_attendance ? `${event.expected_attendance} guests` : 'Not set'"></dd></div><div><dt><span x-html="iconFor('message')"></span>Clarification</dt><dd x-text="event.clarification_note || 'None outstanding'"></dd></div></dl>
            <div class="card-actions" x-show="['Draft', 'Submitted', 'Under Review', 'Returned'].includes(event.status)"><button x-show="['Submitted', 'Under Review', 'Returned'].includes(event.status)" @click="openAmend(event)" class="button button-secondary">Amend request</button><button x-show="['Draft', 'Returned'].includes(event.status)" @click="submitEvent(event.id)" class="button button-primary">Submit for review <span>→</span></button></div>
          </article></template></div>
        </section></template>

        <template x-if="currentPath === '/events/new' && user.role === 'Organiser'"><section class="form-page">
          <button @click="navigate('/events')" class="back-link">← Back to event requests</button><div class="page-header"><div><p class="eyebrow">New request</p><h1>Tell us about your event</h1><p>Start with the essential details. You can amend the request while it is being reviewed.</p></div></div>
          <form class="form-card" @submit.prevent="createEventDraft(draft)" novalidate>
            <fieldset><legend><span>01</span><div>Event overview<small>Give the planning team a clear understanding of your event.</small></div></legend><div class="form-section-body"><div class="field-group"><label for="event-title">Event title <em>Required</em></label><input id="event-title" x-model.trim="draft.title" :aria-invalid="fieldErrors.title ? 'true' : 'false'" required placeholder="e.g. Regional Partner Summit"><small class="field-error" x-text="fieldErrors.title"></small></div><div class="field-group"><label for="event-purpose">Purpose</label><textarea id="event-purpose" x-model="draft.purpose" rows="3" placeholder="What should this event achieve?"></textarea></div><div class="field-group"><label for="event-description">Description</label><textarea id="event-description" x-model="draft.description" rows="4" placeholder="Share the format, audience, and any useful context."></textarea></div></div></fieldset>
            <fieldset><legend><span>02</span><div>Schedule & attendance<small>Initial estimates help the team assess availability.</small></div></legend><div class="form-section-body form-grid"><div class="field-group"><label for="event-start">Proposed start</label><input id="event-start" x-model="draft.proposed_start" type="datetime-local" :aria-invalid="fieldErrors.proposed_start ? 'true' : 'false'"><small class="field-error" x-text="fieldErrors.proposed_start"></small></div><div class="field-group"><label for="event-attendance">Expected attendance</label><input id="event-attendance" x-model.number="draft.expected_attendance" type="number" min="1" placeholder="e.g. 120" :aria-invalid="fieldErrors.expected_attendance ? 'true' : 'false'"><small class="field-error" x-text="fieldErrors.expected_attendance"></small></div></div></fieldset>
            <fieldset><legend><span>03</span><div>Venue needs<small>Describe the space or setup you have in mind.</small></div></legend><div class="form-section-body"><div class="field-group"><label for="venue-requirements">Venue requirements</label><textarea id="venue-requirements" x-model="draft.venue_requirements" rows="4" placeholder="Room layout, accessibility, catering, breakout spaces…"></textarea></div></div></fieldset>
            <div class="form-actions"><button type="button" class="button button-secondary" @click="navigate('/events')">Cancel</button><button class="button button-primary" :disabled="loading">Save draft <span>→</span></button></div>
          </form>
        </section></template>

        <template x-if="currentPath === '/lead/events' && user.role === 'Event Coordinator Lead'"><section class="operations-page">
          <div class="page-header"><div><p class="eyebrow">Event Coordinator Lead workspace</p><h1>Assignment oversight</h1><p>Balance coordinator workloads and arrange venues for submitted events.</p></div><div class="attention-pill" x-show="leadEvents.filter(event => !event.assigned_coordinator_id).length"><i></i><strong x-text="leadEvents.filter(event => !event.assigned_coordinator_id).length"></strong> need assignment</div></div>
          <div class="summary-strip operations-summary"><div><span>Needs assignment</span><strong x-text="leadEvents.filter(event => !event.assigned_coordinator_id).length"></strong></div><div><span>Assigned events</span><strong x-text="leadEvents.filter(event => event.assigned_coordinator_id).length"></strong></div><div><span>Active coordinators</span><strong x-text="coordinators.length"></strong></div></div>
          <div x-show="leadEvents.length === 0 && !loading" class="state-card compact"><div class="state-icon" x-html="iconFor('inbox')"></div><h2>No submitted requests</h2><p>Newly submitted requests will appear here for assignment.</p></div>
          <div class="queue-panel" x-show="leadEvents.length > 0"><div class="queue-heading"><div><h2>Requests and assignments</h2><p>Unassigned requests appear alongside active Coordinator assignments.</p></div><span x-text="`${leadEvents.length} ${leadEvents.length === 1 ? 'request' : 'requests'}`"></span></div>
            <template x-for="event in leadEvents" :key="event.id"><article class="queue-row lead-event-row" :class="!event.assigned_coordinator_id ? 'waiting-row' : ''"><div class="event-card-top"><div><p class="card-kicker" x-text="`Event request #${event.id} · ${event.organiser}`"></p><h3 x-text="event.title"></h3></div><span class="status-badge" :class="statusClass(event.status)"><i></i><span x-text="event.status"></span></span></div><dl class="inline-meta"><div><dt>Proposed</dt><dd x-text="formatDate(event.proposed_start)"></dd></div><div><dt>Attendance</dt><dd x-text="event.expected_attendance ? `${event.expected_attendance} guests` : 'Not set'"></dd></div><div><dt>Coordinator</dt><dd :class="!event.assigned_coordinator ? 'unassigned-text' : ''" x-text="event.assigned_coordinator || 'Needs assignment'"></dd></div></dl><div class="lead-row-actions"><button type="button" class="button button-secondary" @click="openEventDetail(event.id)">Open request</button><button type="button" class="button button-secondary" x-show="canBookEvent(event)" @click="openBookings(event)"><span x-html="iconFor('building')"></span> Venue bookings</button><div class="assignment-controls"><div class="select-field"><label :for="`coordinator-${event.id}`">Assigned coordinator</label><select :id="`coordinator-${event.id}`" x-model="event.selectedCoordinatorId"><option value="">Select coordinator</option><template x-for="coordinator in coordinators" :key="coordinator.id"><option :value="coordinator.id" x-text="coordinator.username"></option></template></select></div><button class="button button-primary" @click="saveAssignment(event)" x-text="event.assigned_coordinator_id ? 'Save reassignment' : 'Assign coordinator'"></button></div></div></article></template>
          </div>
        </section></template>

        <template x-if="currentPath === '/coordinator/all-events' && user.role === 'Coordinator'"><section>
          <div class="page-header"><div><p class="eyebrow">Coordinator workspace</p><h1>All submitted events</h1><p>Read-only visibility across the planning pipeline. Management actions remain limited to your assigned requests.</p></div></div>
          <div x-show="allCoordinatorEvents.length === 0 && !loading" class="state-card compact"><h2>No submitted events</h2><p>Organiser drafts remain private and do not appear here.</p></div>
          <div class="event-grid"><template x-for="event in allCoordinatorEvents" :key="event.id"><article class="event-card"><div class="event-card-top"><div><p class="card-kicker" x-text="`Event request #${event.id} · ${event.organiser}`"></p><h3 x-text="event.title"></h3></div><span class="status-badge" :class="statusClass(event.status)"><i></i><span x-text="event.status"></span></span></div><dl class="inline-meta"><div><dt>Proposed</dt><dd x-text="formatDate(event.proposed_start)"></dd></div><div><dt>Coordinator</dt><dd x-text="event.assigned_coordinator || 'Unassigned'"></dd></div><div><dt>Access</dt><dd x-text="event.is_assigned_to_me ? 'Assigned to you' : 'Read only'"></dd></div></dl><button type="button" class="button button-secondary" @click="openEventDetail(event.id)">Open request</button></article></template></div>
        </section></template>

        <template x-if="currentPath === '/coordinator/events' && user.role === 'Coordinator'"><section>
          <div class="page-header"><div><p class="eyebrow">Coordinator workspace</p><h1>Assigned requests</h1><p>Review event briefs, record decisions, and keep requests moving.</p></div><div class="attention-pill"><i></i><strong x-text="assignedEvents.filter(event => event.awaiting_first_review).length"></strong> awaiting first review</div></div>
          <div class="summary-strip"><div><span>Assigned to you</span><strong x-text="assignedEvents.length"></strong></div><div><span>Awaiting review</span><strong x-text="assignedEvents.filter(event => event.awaiting_first_review).length"></strong></div><div><span>In progress</span><strong x-text="assignedEvents.filter(event => event.status === 'Under Review').length"></strong></div></div>
          <div x-show="assignedEvents.length === 0 && !loading" class="state-card compact"><div class="state-icon" x-html="iconFor('inbox')"></div><h2>Your review queue is clear</h2><p>Newly assigned requests will appear here when they need your attention.</p></div>
          <div class="queue-panel" x-show="assignedEvents.length > 0"><div class="queue-heading"><div><h2>Review queue</h2><p>Requests are ordered by their current workflow state.</p></div><span x-text="`${assignedEvents.length} ${assignedEvents.length === 1 ? 'request' : 'requests'}`"></span></div>
            <template x-for="event in assignedEvents" :key="event.id"><article class="queue-row" :class="event.awaiting_first_review ? 'waiting-row' : ''"><div class="event-card-top"><div><p class="card-kicker" x-text="`Event request #${event.id} · ${event.organiser || 'Event organiser'}`"></p><h3 x-text="event.title"></h3></div><span class="status-badge" :class="event.awaiting_first_review ? 'status-waiting' : statusClass(event.status)"><i></i><span x-text="event.awaiting_first_review ? 'Awaiting review' : event.status"></span></span></div><dl class="inline-meta"><div><dt>Proposed</dt><dd x-text="formatDate(event.proposed_start)"></dd></div><div><dt>Attendance</dt><dd x-text="event.expected_attendance ? `${event.expected_attendance} guests` : 'Not set'"></dd></div></dl><button type="button" class="button button-secondary" x-show="canBookEvent(event)" @click="openBookings(event)">Venue bookings</button><button type="button" class="button button-secondary" @click="openEventDetail(event.id)">Open request</button><div class="queue-actions" x-show="canDecideEvent(event)"><button x-show="event.status === 'Submitted'" :disabled="decisionBusy" @click="startReview(event.id)" class="button button-primary">Start review</button><button :disabled="decisionBusy" @click="handleApprove(event.id)" class="button button-success">Approve</button><button @click="openDecision(event, 'return')" class="button button-secondary">Request clarification</button><button @click="openDecision(event, 'reject')" class="button button-danger-quiet">Reject</button></div></article></template>
          </div>
        </section></template>
      </main>
    </section>
    <template x-if="eventDetail"><div class="modal-backdrop" @click.self="closeEventDetail()" @keydown.escape.window="if (!modal.open) closeEventDetail()"><section class="modal-card booking-dialog" role="dialog" aria-modal="true" aria-labelledby="event-detail-title" x-init="$nextTick(() => $el.querySelector('button').focus())">
      <div class="modal-header"><h2 id="event-detail-title" x-text="`Event request #${eventDetail.id}`"></h2><button class="icon-button" @click="closeEventDetail()" aria-label="Close event request">?</button></div>
      <div class="modal-body"><div class="inline-state" x-show="eventDetail.loading" role="status">Loading request details...</div><div x-show="eventDetail.error" role="alert"><p x-text="eventDetail.error"></p><button class="button button-secondary" @click="openEventDetail(eventDetail.id)">Retry</button></div>
      <template x-if="eventDetail.detail"><div><span class="status-badge" :class="statusClass(eventDetail.detail.status)" x-text="eventDetail.detail.status"></span><dl class="booking-detail-grid event-detail-fields"><template x-for="(value, key) in eventDetail.detail" :key="key"><div class="wide"><dt x-text="eventFieldLabel(key)"></dt><dd x-text="eventFieldValue(key, value)"></dd></div></template></dl>
      <p class="field-error" role="alert" x-show="eventDetail.actionError" x-text="eventDetail.actionError"></p><div class="queue-actions" x-show="canDecideEvent(eventDetail.detail)"><button class="button button-primary" x-show="canDecideEvent(eventDetail.detail, 'review')" :disabled="decisionBusy" @click="startReview(eventDetail.id)">Start review</button><button class="button button-success" :disabled="decisionBusy" @click="handleApprove(eventDetail.id)">Approve</button><button class="button button-secondary" :disabled="decisionBusy" @click="openDecision(eventDetail.detail, 'return')">Request clarification</button><button class="button button-danger-quiet" :disabled="decisionBusy" @click="openDecision(eventDetail.detail, 'reject')">Reject</button></div><p x-show="decisionBusy" role="status">Submitting decision...</p></div></template></div>
    </section></div></template>

    <template x-if="staffBooking && isVenueStaff()"><div class="modal-backdrop" @click.self="staffBooking = null" @keydown.escape.window="staffBooking = null"><section class="modal-card booking-dialog review-dialog" role="dialog" aria-modal="true" aria-labelledby="staff-booking-title" x-init="$nextTick(() => $el.querySelector('button').focus())"><div class="modal-header"><div><p class="eyebrow">Venue booking</p><h2 id="staff-booking-title">Review request</h2></div><button class="icon-button" @click="staffBooking = null" aria-label="Close booking review">×</button></div><div class="modal-body"><div class="inline-state" x-show="staffBooking.busy" role="status"><span class="spinner dark"></span> Loading booking details…</div><div class="inline-state error" x-show="!staffBooking.busy && !staffBooking.detail">Booking details could not be loaded. Close this dialog and try again.</div>
      <template x-if="staffBooking.detail"><div class="review-content"><div class="dialog-error" role="alert" x-show="staffBooking.error" x-effect="staffBooking?.error && $nextTick(() => $el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }))"><span x-html="iconFor('alert')"></span><span x-text="staffBooking.error"></span></div><div class="review-title"><span class="venue-monogram" x-text="staffBooking.detail.venue?.name?.charAt(0)"></span><div><p>Venue</p><h3 x-text="staffBooking.detail.venue?.name"></h3></div><span class="status-badge" :class="bookingStatusClass(staffBooking.detail.status)"><i></i><span x-text="staffBooking.detail.status"></span></span></div><dl class="booking-detail-grid"><div><dt>Event</dt><dd x-text="staffBooking.detail.event_title"></dd></div><div><dt>Requester</dt><dd x-text="requesterLabel(staffBooking.detail)"></dd></div><div class="wide"><dt>Schedule</dt><dd x-text="formatSchedule(staffBooking.detail.booking_start, staffBooking.detail.booking_end)"></dd></div><div><dt>Capacity</dt><dd x-text="staffBooking.detail.venue?.capacity ? `${staffBooking.detail.venue?.capacity} people` : 'Not recorded'"></dd></div><div><dt>Layouts</dt><dd x-text="listText(staffBooking.detail.venue?.supported_layouts)"></dd></div><div class="wide"><dt>Accessibility</dt><dd x-text="staffBooking.detail.venue?.accessibility || 'Not recorded'"></dd></div><div class="wide"><dt>Facilities</dt><dd x-text="listText(staffBooking.detail.venue?.facilities)"></dd></div><div><dt>Hold expires</dt><dd x-text="staffBooking.detail.hold_expires_at ? `${formatUtc(staffBooking.detail.hold_expires_at)}` : 'No hold'"></dd></div><div><dt>Coordinator warning</dt><dd x-text="staffBooking.detail.warning_minutes != null ? `${staffBooking.detail.warning_minutes} min before expiry` : 'Not set'"></dd></div></dl><div class="conflict-callout" role="note" x-show="staffBooking.detail.conflict_flag"><strong>Possible clash</strong><span x-text="staffBooking.detail.conflict_flag?.reason"></span></div><div class="rejection-callout" x-show="staffBooking.detail.rejection_reason"><strong>Rejection reason</strong><span x-text="staffBooking.detail.rejection_reason"></span></div>
      <template x-if="staffBooking.detail.status === 'Pending'"><form class="hold-form" @submit.prevent="setStaffHold()" novalidate><div class="field-group"><label for="staff-hold-expiry">Set or extend the hold <em>Before the booking starts</em></label><input id="staff-hold-expiry" type="datetime-local" x-model="staffBooking.holdExpiry" :disabled="staffBooking.busy" :aria-invalid="!!fieldErrors.holdExpiry"><small class="field-error" x-text="fieldErrors.holdExpiry"></small></div><button type="submit" class="button button-secondary" :disabled="staffBooking.busy">Update hold</button></form></template>
      <template x-if="staffBooking.detail.status === 'Pending'"><form class="decision-form" @submit.prevent="decideStaffBooking('reject')" novalidate><fieldset :disabled="staffBooking.busy"><div class="decision-heading"><h4>Record a decision</h4><p>Approve the requested schedule, or provide a clear reason for rejection.</p></div><div class="field-group"><label for="staff-rejection-reason">Rejection reason <em>Required only when rejecting</em></label><textarea id="staff-rejection-reason" x-model="staffBooking.reason" rows="4" :aria-invalid="!!fieldErrors.reason" placeholder="Explain why this venue or schedule cannot be approved."></textarea><small class="field-error" x-text="fieldErrors.reason"></small></div><div class="modal-actions"><button type="submit" class="button button-danger-quiet">Reject request</button><button type="button" class="button button-success" @click="decideStaffBooking('approve')"><span x-html="iconFor('check')"></span> Approve booking</button></div></fieldset></form></template></div></template>
    </div></section></div></template>
    <template x-if="bookingDialog"><div class="modal-backdrop" @keydown.escape.window="closeBookings()" @click.self="closeBookings()"><section class="modal-card booking-dialog" role="dialog" aria-modal="true" aria-labelledby="booking-title" x-init="$nextTick(() => $el.querySelector('button').focus())">
      <div class="modal-header"><div><p class="eyebrow" x-text="bookingDialog.event.title"></p><h2 id="booking-title">Venue bookings</h2></div><button class="icon-button" @click="closeBookings()" aria-label="Close venue bookings">×</button></div>
      <div class="modal-body">
        <p x-show="alert?.message" role="status" x-text="alert?.message"></p>
        <div class="inline-state" x-show="bookingDialog.busy" role="status"><span class="spinner dark"></span> Loading bookings…</div>
        <div class="dialog-section-heading"><div><h3>Booking history</h3><p>Existing requests for this event.</p></div><button type="button" class="button button-secondary button-compact" :disabled="bookingDialog.busy" @click="openBookings(bookingDialog.event)">Refresh</button></div>
        <p x-show="!bookingDialog.busy && !bookingDialog.bookingsLoaded" role="status">Booking history could not be loaded. You can still request a venue if venues are available.</p>
        <p x-show="bookingDialog.bookingsLoaded && !bookingDialog.bookings.length">No booking requests yet.</p>
        <ul class="booking-list"><template x-for="booking in bookingDialog.bookings" :key="booking.id"><li><div><strong x-text="booking.venue_name"></strong><p x-text="formatSchedule(booking.booking_start, booking.booking_end)"></p></div><span class="status-badge" :class="bookingStatusClass(booking.status)"><i></i><span x-text="booking.status"></span></span><p class="rejection-callout" x-show="booking.rejection_reason"><strong>Rejection reason</strong><span x-text="booking.rejection_reason"></span></p></li></template></ul>
        <form class="request-booking-form" @submit.prevent="submitBooking()" novalidate>
          <fieldset :disabled="bookingDialog.submitting"><legend>Request another venue</legend><p class="form-help">Choose an available venue and the complete booking window.</p>
            <p x-show="bookingDialog.ready && !bookingDialog.venues.length" role="status">No venues available. Please contact Venue Staff to add a venue.</p>
            <p x-show="!bookingDialog.busy && !bookingDialog.ready" role="status">Venues could not be loaded. Refresh bookings to try again.</p>
            <div class="field-group"><label for="booking-venue">Venue</label><select id="booking-venue" x-model="bookingDialog.form.venue_id" required :aria-invalid="!!fieldErrors.venue_id"><option value="">Select a venue</option><template x-for="venue in bookingDialog.venues" :key="venue.id"><option :value="venue.id" x-text="venue.name"></option></template></select><small class="field-error" x-text="fieldErrors.venue_id"></small></div>
            <div class="date-time-grid"><div class="field-group"><label for="booking-start">Start date and time</label><input id="booking-start" type="datetime-local" x-model="bookingDialog.form.booking_start" required :aria-invalid="!!fieldErrors.booking_start"><small class="field-error" x-text="fieldErrors.booking_start"></small></div><div class="field-group"><label for="booking-end">End date and time</label><input id="booking-end" type="datetime-local" x-model="bookingDialog.form.booking_end" required :aria-invalid="!!fieldErrors.booking_end"><small class="field-error" x-text="fieldErrors.booking_end"></small></div></div>
            <button class="button button-primary" type="submit" :disabled="bookingDialog.busy || !bookingDialog.ready || !bookingDialog.form.venue_id">Submit booking request</button>
          </fieldset>
        </form>
      </div>
    </section></div></template>
    <template x-if="modal.open"><div class="modal-backdrop" @keydown.escape.window="closeModal()" @click.self="closeModal()"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title" x-transition><div class="modal-header"><div><p class="eyebrow" x-text="modal.event ? `Event request #${modal.event.id} · ${modal.event.title}` : 'Event request'"></p><h2 id="modal-title" x-text="modal.kind === 'reject' ? 'Reject request' : modal.kind === 'return' ? 'Request clarification' : 'Amend event'"></h2></div><button @click="closeModal()" aria-label="Close dialog">×</button></div><form @submit.prevent="submitModal()"><fieldset :disabled="decisionBusy" style="border:0;padding:0;margin:0;min-width:0">
      <template x-if="modal.kind === 'amend'"><div class="modal-body"><p class="form-help">Update the details below. Existing workflow status and ownership will remain unchanged.</p><div class="field-group"><label for="amend-title">Event title <em>Required</em></label><input id="amend-title" x-model.trim="amendForm.title" required :aria-invalid="fieldErrors.title ? 'true' : 'false'"><small class="field-error" x-text="fieldErrors.title"></small></div><div class="field-group"><label for="amend-description">Description</label><textarea id="amend-description" x-model="amendForm.description" rows="5"></textarea></div></div></template>
      <template x-if="modal.kind !== 'amend'"><div class="modal-body"><p class="form-help" x-text="modal.kind === 'reject' ? 'Explain the decision clearly so the organiser understands the outcome.' : 'Describe exactly what information the organiser needs to provide.'"></p><div class="field-group"><label for="decision-reason">Reason <em>Required</em></label><textarea id="decision-reason" x-model.trim="decisionForm.reason" rows="5" required :aria-invalid="fieldErrors.reason ? 'true' : 'false'" placeholder="Provide a concise, actionable explanation."></textarea><small class="field-error" x-text="fieldErrors.reason"></small><p class="field-error" role="alert" x-text="fieldErrors.form"></p></div></div></template>
      <div class="modal-actions"><button type="button" @click="closeModal()" class="button button-secondary">Cancel</button><button class="button" :class="modal.kind === 'reject' ? 'button-danger' : 'button-primary'" x-text="modal.kind === 'amend' ? 'Save changes' : modal.kind === 'reject' ? 'Reject request' : 'Send clarification request'"></button></div>
    </fieldset></form></section></div></template>
  </div></template>
</div>
</body></html>
